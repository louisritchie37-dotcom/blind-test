<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15131e">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Blind Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : une colonne façon « carte de club » centrée, enseigne lumineuse en tête, sets empilés comme un programme de soirée. Thème unique : club de nuit. */
:root {
  --night: #15131e;
  --velvet: #221c30;
  --curtain: #5e1a26;
  --brass: #e0b04f;
  --brass-deep: #9c7228;
  --cream: #f3e6c8;
  --smoke: #a8a0ba;
  --line: #3a3150;
  --ok: #73c98f;
  --ko: #ee6b73;
  --f-display: "Abril Fatface", "Playfair Display", Georgia, serif;
  --f-body: "Karla", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background:
    radial-gradient(ellipse 70% 40% at 50% -5%, rgba(224,176,79,.16), transparent 70%),
    radial-gradient(ellipse 60% 50% at 100% 100%, rgba(94,26,38,.45), transparent 70%),
    var(--night);
  background-attachment: fixed;
  color: var(--cream);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
.app {
  max-width: 680px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 28px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--smoke); font-weight: 700; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }

/* ——— Enseigne ——— */
.marquee {
  position: relative;
  border: 2px solid var(--brass);
  border-radius: 20px;
  padding: 26px 22px 22px;
  background: linear-gradient(180deg, rgba(94,26,38,.55), rgba(34,28,48,.9));
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
  overflow: hidden;
}
.bulbs { position: absolute; inset: 7px; pointer-events: none; border-radius: 14px;
  background-image: radial-gradient(circle, var(--brass) 2px, transparent 2.6px);
  background-size: 18px 18px; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  padding: 5px; opacity: .55; animation: twinkle 2.4s steps(2) infinite; }
@keyframes twinkle { 50% { opacity: .9; } }
.marquee h1 { font-size: clamp(40px, 11vw, 64px); line-height: .95; color: var(--cream); }
.marquee h1 em { font-style: normal; color: var(--brass); display: block; }
.marquee .tag { margin-top: 10px; color: var(--smoke); max-width: 30ch; }
.hero-vinyl { width: clamp(96px, 26vw, 150px); }
.hero-vinyl svg { width: 100%; height: auto; display: block; animation: spin 6s linear infinite; }

/* ——— Liste des sets ——— */
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 28px; }
.sets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.set {
  width: 100%; text-align: left;
  display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; align-items: center;
  background: var(--velvet); border: 1px solid var(--line); border-radius: 16px;
  padding: 12px 16px 12px 12px;
  transition: transform .15s ease, border-color .15s ease;
}
.set:hover { transform: translateY(-2px); border-color: var(--lvl); }
.set .art { width: 72px; height: 72px; }
.set .art svg { width: 100%; height: 100%; display: block; }
.set .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.set .num { font-family: var(--f-mono); font-size: 12px; color: var(--lvl); letter-spacing: .08em; }
.set h3 { font-size: 21px; line-height: 1.15; }
.set .blurb { color: var(--smoke); font-size: 14px; }
.set .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.diff { display: flex; gap: 3px; }
.diff i { width: 7px; height: 14px; border-radius: 2px; background: var(--line); }
.diff i.on { background: var(--lvl); }
.best { font-size: 12px; color: var(--smoke); white-space: nowrap; }
.stars { color: var(--brass); letter-spacing: 2px; font-size: 14px; }
.stars .off { color: var(--line); }

.foot-note { font-size: 13px; color: var(--smoke); display: flex; gap: 10px; align-items: flex-start;
  border-top: 1px dashed var(--line); padding-top: 16px; }
.foot-note .chip { flex: none; }
.chip { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  border: 1px solid var(--brass-deep); color: var(--brass); padding: 3px 8px; border-radius: 999px; }

/* ——— Partie ——— */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--smoke); }
.back:hover { color: var(--cream); border-color: var(--smoke); }
.scorebox { text-align: right; }
.scorebox .val { font-size: 22px; color: var(--brass); }
.level-title { display: flex; flex-direction: column; gap: 4px; }
.level-title h2 { font-size: clamp(28px, 7vw, 38px); }
.dots { display: flex; gap: 6px; margin-top: 6px; }
.dots span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.dots span.ok { background: var(--ok); }
.dots span.ko { background: var(--ko); }
.dots span.cur { background: var(--lvl); }

.stage {
  position: relative; border-radius: 22px; padding: 20px;
  background: linear-gradient(160deg, #2b2340, #1a1626);
  border: 1px solid var(--line);
  display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center;
}
.deck { position: relative; width: clamp(130px, 36vw, 180px); aspect-ratio: 1; max-width: 100%; }
.deck .disc { width: 100%; height: 100%; display: block; }
.deck .disc.spinning { animation: spin 1.8s linear infinite; }
.deck .arm { position: absolute; width: 46%; right: -10%; top: -6%; transform-origin: 78% 12%;
  transform: rotate(-26deg); transition: transform .6s cubic-bezier(.3,1.4,.5,1); }
.deck .arm.down { transform: rotate(0deg); }
@keyframes spin { to { transform: rotate(360deg); } }
.controls { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.play {
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--brass); color: #231a08; border: none; border-radius: 999px;
  padding: 12px 22px 12px 14px; font-weight: 700; font-size: 17px;
  box-shadow: 0 6px 0 var(--brass-deep);
  transition: transform .1s ease, box-shadow .1s ease;
}
.play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--brass-deep); }
.play .ico { width: 30px; height: 30px; border-radius: 50%; background: #231a08; display: grid; place-items: center; }
.play .ico svg { width: 12px; height: 12px; }
.play[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; }
.timer { display: flex; flex-direction: column; gap: 6px; }
.timer .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--smoke); }
.timer .clock { color: var(--cream); font-size: 15px; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--lvl); transform-origin: left; }
.sim { font-size: 12px; color: var(--smoke); }

.choices { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice {
  width: 100%; height: 100%; text-align: left;
  display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start;
  background: var(--velvet); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  transition: border-color .15s ease, background .15s ease, transform .1s ease;
}
.choice:not([disabled]):hover { border-color: var(--lvl); transform: translateY(-1px); }
.choice .k { font-family: var(--f-mono); font-size: 13px; width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center; border: 1px solid var(--line); color: var(--smoke); }
.choice .t { min-width: 0; display: flex; flex-direction: column; }
.choice .title { font-weight: 700; font-size: 16px; line-height: 1.25; }
.choice .artist { color: var(--smoke); font-size: 14px; }
.choice[disabled] { cursor: default; }
.choices.locked .choice { opacity: .45; filter: blur(.6px); }
.choice.is-ok { border-color: var(--ok); background: rgba(115,201,143,.12); opacity: 1 !important; filter: none !important; }
.choice.is-ok .k { background: var(--ok); color: #10251a; border-color: var(--ok); }
.choice.is-ko { border-color: var(--ko); background: rgba(238,107,115,.12); opacity: 1 !important; filter: none !important; }
.choice.is-ko .k { background: var(--ko); color: #2c0d10; border-color: var(--ko); }
.hint { text-align: center; color: var(--smoke); font-size: 14px; }

.feedback {
  border-radius: 18px; padding: 18px 20px; border: 1px solid var(--line);
  background: var(--velvet); display: flex; flex-direction: column; gap: 10px;
}
.feedback.ok { border-color: var(--ok); }
.feedback.ko { border-color: var(--ko); }
.feedback h3 { font-size: 26px; }
.feedback.ok h3 { color: var(--ok); }
.feedback.ko h3 { color: var(--ko); }
.feedback .answer { font-weight: 700; }
.feedback .answer span { color: var(--smoke); font-weight: 400; }
.feedback .fact { color: var(--smoke); font-size: 15px; }
.reveal { display: flex; gap: 14px; align-items: center; }
.reveal img { width: 72px; height: 72px; border-radius: 8px; flex: none; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.reveal-t { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.dz { color: var(--brass); font-size: 14px; }
.feedback .pts { font-size: 14px; color: var(--brass); }
.next { align-self: flex-end; background: var(--cream); color: var(--night); border: none; border-radius: 999px;
  padding: 10px 20px; font-weight: 700; }

/* ——— Résultat ——— */
.result-card { border: 2px solid var(--lvl); border-radius: 22px; padding: 24px 22px;
  background: linear-gradient(180deg, rgba(94,26,38,.4), var(--velvet));
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.result-card .big { font-family: var(--f-display); font-size: clamp(48px, 14vw, 72px); line-height: 1; color: var(--brass); }
.result-card .verdict { font-size: 18px; }
.result-card .stars { font-size: 26px; }
.result-card .art { width: clamp(90px, 24vw, 120px); }
.result-card .art svg { width: 100%; height: auto; display: block; }
.recap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.recap li { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.recap .mark { font-weight: 700; }
.recap .mark.ok { color: var(--ok); }
.recap .mark.ko { color: var(--ko); }
.recap .t { min-width: 0; }
.recap .t span { color: var(--smoke); }
.recap .p { font-size: 14px; color: var(--brass); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border-radius: 999px; padding: 11px 20px; font-weight: 700; border: 1px solid var(--line); background: var(--velvet); }
.btn.primary { background: var(--brass); color: #231a08; border-color: var(--brass); }

@media (max-width: 560px) {
  .choices { grid-template-columns: 1fr; }
  .stage { grid-template-columns: 1fr; justify-items: center; }
  .controls { width: 100%; }
  .play { align-self: center; }
  .set { grid-template-columns: 56px 1fr; }
  .set .art { width: 56px; height: 56px; }
  .set .meta { grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px; }
  .result-card { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ——— Salles & thèmes ——— */
.stack { display: flex; flex-direction: column; gap: 14px; }
.marquee h1 em { display: inline; }
.rooms { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.room { width: 100%; height: 100%; text-align: left; display: flex; flex-direction: column; gap: 14px;
  background: var(--velvet); border: 1px solid var(--line); border-radius: 20px; padding: 18px;
  transition: transform .15s ease, border-color .15s ease; }
.room:hover { transform: translateY(-3px); border-color: var(--lvl); }
.room-art { width: 88px; height: 88px; flex: none; }
.room-art svg { width: 100%; height: 100%; display: block; }
.room-txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.room .num { font-family: var(--f-mono); font-size: 12px; color: var(--lvl); letter-spacing: .08em; text-transform: uppercase; }
.room h3 { font-size: 30px; line-height: 1.05; }
.room .blurb { color: var(--smoke); font-size: 14px; }
.room-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.room-head { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; border-bottom: 1px dashed var(--line); padding-bottom: 20px; }
.room-title { font-size: clamp(40px, 11vw, 60px); line-height: .95; color: var(--lvl); margin-top: 4px; }
.room-head .tag { margin-top: 10px; color: var(--smoke); max-width: 40ch; }
.room-art.lg { width: clamp(90px, 24vw, 130px); height: auto; }
.decade { font-size: 12px; color: var(--lvl); white-space: nowrap; }
.decade-group { border-top: 1px dashed var(--line); padding-top: 20px; }
.decade-head { display: flex; gap: 14px; align-items: center; }
.decade-head h2 { font-size: 28px; color: var(--lvl); }
.decade-head .blurb { color: var(--smoke); font-size: 14px; margin-top: 2px; }
.decade-art { width: 60px; height: 60px; flex: none; }
.decade-art svg { width: 100%; height: 100%; display: block; }
.sets.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.set.tier { grid-template-columns: 1fr; height: 100%; align-content: space-between; padding: 14px; }
.set.tier h3 { font-size: 22px; }
.set.tier .meta { align-items: flex-start; }
@media (max-width: 560px) {
  .sets.tiers { grid-template-columns: 1fr; }
  .set.tier { grid-template-columns: 1fr auto; align-items: center; }
  .set.tier .meta { grid-column: auto; flex-direction: column; align-items: flex-end; }
}
.play.is-pause { background: var(--cream); }
/* ——— Duo ——— */
.modes { display: flex; flex-direction: column; gap: 10px; }
.seg { display: inline-flex; align-self: flex-start; padding: 4px; gap: 4px; border-radius: 999px; background: var(--velvet); border: 1px solid var(--line); }
.seg-b { border: none; background: none; border-radius: 999px; padding: 8px 22px; font-weight: 700; color: var(--smoke); }
.seg-b.on { background: var(--brass); color: #231a08; }
.mode-line { color: var(--smoke); font-size: 14px; }
.mode-line strong { color: var(--cream); }
.linkish { background: none; border: none; padding: 0; color: var(--brass); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.duo-form { display: flex; flex-direction: column; gap: 16px; max-width: 420px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; }
.field input { font: inherit; color: var(--cream); background: var(--velvet); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.field input:focus-visible { border-color: var(--brass); }
.field input[aria-invalid="true"] { border-color: var(--ko); }
.err { color: var(--ko); font-weight: 700; }
.duo-score { display: flex; gap: 8px; }
.duo-score .pl { display: flex; flex-direction: column; align-items: flex-end; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--line); min-width: 0; }
.duo-score .pl.on { border-color: var(--lvl); background: var(--velvet); }
.duo-score .nm { font-size: 12px; color: var(--smoke); max-width: 10ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.duo-score .pl.on .nm { color: var(--cream); font-weight: 700; }
.duo-score .val { font-size: 18px; color: var(--brass); }
.handoff { border: 2px solid var(--lvl); border-radius: 22px; padding: 28px 22px; text-align: center;
  background: linear-gradient(160deg, #2b2340, #1a1626); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.handoff h2 { font-size: clamp(32px, 9vw, 46px); color: var(--lvl); }
.handoff .tag { color: var(--smoke); }
.handoff .play { align-self: center; }
.podium { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.podium li { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: baseline; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); }
.podium li.win { border-color: var(--lvl); }
.podium .nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.podium .pts { color: var(--brass); }
.recap .who { display: block; font-size: 12px; color: var(--smoke); }
.play.is-pause .ico { background: #231a08; }
.reveal { display: flex; gap: 14px; align-items: center; }
@media (max-width: 560px) {
  .rooms { grid-template-columns: 1fr; }
  .room { flex-direction: row; align-items: flex-start; }
  .room-art { width: 64px; height: 64px; }
}
</style>
</head>

<div class="app" id="app"></div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
/* ===================== Données : Jazz Club ===================== */
const JAZZ = [
  { id: 1, name: "Les incontournables", instrument: "trumpet", color: "#e0b04f",

        decoys: [["Stardust","Hoagy Carmichael"],["Stompin' at the Savoy","Benny Goodman"],["A String of Pearls","Glenn Miller"]] },

      { title: "Cry Me a River", artist: "Julie London", year: 1955,
        fact: "Écrit par Arthur Hamilton, d'abord pour Ella Fitzgerald dans un film, avant d'être coupé au montage.",

    ] },

/* ===================== API Deezer =====================
   1. Sur Netlify : /api/deezer/* est redirigé vers api.deezer.com (voir netlify.toml), donc fetch classique.
   2. Ailleurs (fichier ouvert en local) : repli en JSONP, que Deezer accepte avec output=jsonp.
   Les liens d'extraits expirent : on les cherche au moment de jouer, jamais stockés. */
const PREVIEW_CACHE = new Map();
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

function jsonp(url, ms = 6000) {
  return new Promise((resolve, reject) => {
    const cb = "dz_cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const done = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); reject(new Error("timeout")); }, ms);
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error("jsonp")); };
    s.src = url + (url.includes("?") ? "&" : "?") + "output=jsonp&callback=" + cb;
    document.head.appendChild(s);
  });
}
async function deezer(path) {
  try {
    const r = await fetch("/api/deezer" + path, { headers: { Accept: "application/json" } });
    const type = r.headers.get("content-type") || "";
    if (r.ok && type.includes("json")) return await r.json();
  } catch (e) {}
  return jsonp("https://api.deezer.com" + path);
}
function pickBest(list, track) {
  const want = norm(track.title).split(" ").sort((a, b) => b.length - a.length)[0];
  const art = norm(track.artist).split(" ").filter(w => w.length > 2);
  const withPrev = (list || []).filter(x => x.preview);
  return withPrev.find(x => norm(x.title).includes(want) && art.some(w => norm(x.artist.name).includes(w)))
      || withPrev.find(x => norm(x.title).includes(want))
      || null;
}
async function getPreview(track) {
  const key = track.artist + "|" + track.title;
  if (PREVIEW_CACHE.has(key)) return PREVIEW_CACHE.get(key);
  let hit = null;
  try {
    const a = await deezer("/search?limit=10&q=" + encodeURIComponent(track.q));
    hit = pickBest(a.data, track);
    if (!hit) {
      const b = await deezer("/search?limit=15&q=" + encodeURIComponent(track.artist.split(" & ")[0] + " " + track.title));
      hit = pickBest(b.data, track);
    }
  } catch (e) { hit = null; }
  const res = hit ? { url: hit.preview, cover: hit.album && hit.album.cover_medium, link: hit.link, album: hit.album && hit.album.title } : null;
  PREVIEW_CACHE.set(key, res);
  return res;
}

const player = new Audio();
player.preload = "auto";
let fadeT = 0;
function playClip(url) {
  clearInterval(fadeT);
  player.src = url; player.currentTime = 0; player.volume = 1;
  return player.play();
}
function stopClip() {
  if (player.paused) return;
  clearInterval(fadeT);
  fadeT = setInterval(() => {
    player.volume = Math.max(0, player.volume - 0.15);
    if (player.volume <= 0.01) { clearInterval(fadeT); player.pause(); }
  }, 40);
}

/* ===================== Audio simulé (craquement de vinyle) ===================== */
let actx = null, crackleSrc = null, crackleGain = null;
function startCrackle() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) { d[i] = (Math.random() * 2 - 1) * 0.015; if (Math.random() < 0.0007) d[i] = (Math.random() * 2 - 1) * 0.6; }
    crackleSrc = actx.createBufferSource(); crackleSrc.buffer = buf; crackleSrc.loop = true;
    const f = actx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 800;
    crackleGain = actx.createGain(); crackleGain.gain.value = 0.45;
    crackleSrc.connect(f).connect(crackleGain).connect(actx.destination); crackleSrc.start();
  } catch (e) {}
}
function stopCrackle() {
  try { if (crackleGain) crackleGain.gain.setTargetAtTime(0, actx.currentTime, 0.08); const s = crackleSrc; setTimeout(() => { try { s && s.stop(); } catch (e) {} }, 400); } catch (e) {}
  crackleSrc = null;
}

    tagline: "Cinq sets de difficulté croissante, de Benny Goodman à Albert Ayler, et des sets par style : manouche, salsa, bossa nova.",
    yearLabel: "enregistré en", difficulty: true, levels: JAZZ },
  { id: "retro", name: "Rétro Club", eyebrow: "1960 – 2009", hero: "cassette", color: "#e85fa8",
    tagline: "Pop, rock, disco, variété et latino : trois niveaux par décennie, des Rolling Stones à Daft Punk.",
    yearLabel: "sorti en", difficulty: false, levels: RETRO }
];
THEMES.forEach(th => th.levels.forEach(l => l.tracks.forEach(t => { t.q = `artist:"${t.artist}" track:"${t.title}"`; })));

const ROUND_SECONDS = 20;
const BASE_POINTS = 100;
const BONUS_PER_SEC = 5;

const PLAY_ICO = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1 L11 6 L2 11 Z" fill="#e0b04f"/></svg>`;
const PAUSE_ICO = `<svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1" width="3" height="10" rx="1" fill="#e0b04f"/><rect x="7" y="1" width="3" height="10" rx="1" fill="#e0b04f"/></svg>`;

/* ===================== État & stockage ===================== */
const KEY = "blindtest-best-v2";
function loadBest() {
  let b = {};
  try { b = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  try { // reprise des records de la première version (jazz seul)
    const old = JSON.parse(localStorage.getItem("blindtest-jazz-best") || "null");
    if (old) Object.keys(old).forEach(k => { if (!b["jazz-" + k]) b["jazz-" + k] = old[k]; });
  } catch (e) {}
  return b;
}
function saveBest(b) { try { localStorage.setItem(KEY, JSON.stringify(b)); } catch (e) {} }
let best = loadBest();
const bkey = (th, l) => th.id + "-" + l.id;

const S = { screen: "home", theme: null, level: null, order: [], qi: 0, score: 0, results: [], phase: "idle",
  choices: [], t0: 0, elapsed: 0, raf: 0, picked: null, clip: undefined, token: 0, simulated: false, simMsg: "" };

const $app = document.getElementById("app");
const $live = document.getElementById("live");
const say = m => { $live.textContent = ""; setTimeout(() => { $live.textContent = m; }, 30); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const starsFor = (n, total = 5) => { const r = n / total; return r >= .9 ? 3 : r >= .7 ? 2 : r >= .5 ? 1 : 0; };
const starStr = n => `<span class="stars" aria-label="${n} étoile${n > 1 ? "s" : ""} sur 3">${"★".repeat(n)}<span class="off">${"★".repeat(3 - n)}</span></span>`;
const pad2 = n => String(n).padStart(2, "0");

/* Débloque l'audio pendant un clic, pour que l'extrait suivant puisse démarrer seul (Safari, Chrome mobile). */
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
function unlockAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {}
  if (player.paused) { try { player.src = SILENT; const p = player.play(); if (p) p.catch(() => {}); } catch (e) {} }
}

/* ===================== Mode Duo (un seul appareil, chacun son tour) ===================== */
const DUO_KEY = "blindtest-duo-names";
let DUO = null; // { names: ["Louis", "Marion"] } quand le mode Duo est actif
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function loadDuoNames() { try { const n = JSON.parse(localStorage.getItem(DUO_KEY)); if (Array.isArray(n) && n.length === 2) return n; } catch (e) {} return ["", ""]; }
function saveDuoNames(n) { try { localStorage.setItem(DUO_KEY, JSON.stringify(n)); } catch (e) {} }
const turnOf = qi => S.players ? qi % S.players.length : 0;

function renderDuoSetup() {
  S.screen = "duo";
  const names = DUO ? DUO.names : loadDuoNames();
  $app.style.setProperty("--lvl", "#e0b04f");
  $app.innerHTML = `
    <div class="topbar"><button class="back" id="back">← Accueil</button><span class="eyebrow">Mode Duo</span></div>
    <header class="room-head">
      <div><p class="eyebrow">Blind Test</p><h1 class="room-title">Duo</h1>
        <p class="tag">Un seul téléphone, deux joueurs. Chacun son tour : on se passe l'appareil à chaque morceau, cinq morceaux chacun par set.</p></div>
      <div class="room-art lg">${ART.headphones("#e0b04f")}</div>
    </header>
    <form class="duo-form" id="duo-form" novalidate>
      <div class="field"><label for="p1">Joueur 1</label><input id="p1" name="p1" maxlength="20" autocomplete="off" value="${esc(names[0])}" placeholder="Prénom"></div>
      <div class="field"><label for="p2">Joueur 2</label><input id="p2" name="p2" maxlength="20" autocomplete="off" value="${esc(names[1])}" placeholder="Prénom"></div>
      <p class="err" id="duo-err" role="alert" hidden></p>
      <div class="actions">
        <button class="btn primary" type="submit">Choisir la salle →</button>
        ${DUO ? `<button class="btn" type="button" id="duo-off">Revenir en solo</button>` : ""}
      </div>
    </form>`;
  $app.querySelector("#back").addEventListener("click", renderHome);
  const off = $app.querySelector("#duo-off");
  if (off) off.addEventListener("click", () => { DUO = null; renderHome(); });
  $app.querySelector("#duo-form").addEventListener("submit", e => {
    e.preventDefault();
    const n = ["p1", "p2"].map(id => document.getElementById(id).value.trim());
    const err = document.getElementById("duo-err");
    const bad = !n[0] ? "p1" : !n[1] ? "p2" : n[0].toLowerCase() === n[1].toLowerCase() ? "p2" : null;
    if (bad) {
      err.textContent = !n[0] || !n[1] ? "Donne un prénom à chaque joueur." : "Choisis deux prénoms différents.";
      err.hidden = false;
      document.getElementById(bad).setAttribute("aria-invalid", "true");
      document.getElementById(bad).focus();
      return;
    }
    DUO = { names: n }; saveDuoNames(n);
    renderHome();
    const rooms = document.getElementById("rooms-h"); rooms && rooms.scrollIntoView({ block: "start" });
  });
  const first = document.getElementById(names[0] ? "p2" : "p1"); first.focus();
}

/* ===================== Écrans ===================== */

  $app.innerHTML = `
    <header class="marquee">

      <div>

      </ul>
    </section>

  $app.querySelectorAll(".room").forEach(b => b.addEventListener("click", () => { unlockAudio(); renderTheme(THEMES.find(t => t.id === b.dataset.theme)); }));
  $app.querySelector("#m-solo").addEventListener("click", () => { DUO = null; renderHome(); });
  $app.querySelector("#m-duo").addEventListener("click", renderDuoSetup);
  const ed = $app.querySelector("#m-edit"); if (ed) ed.addEventListener("click", renderDuoSetup);
}

function groupsOf(th) {
  if (th.levels.some(l => l.tier)) { // Rétro : une section par décennie, niveaux 1 à 3
    const keys = [...new Set(th.levels.map(l => l.decadeKey))];
    return keys.map(k => {
      const levels = th.levels.filter(l => l.decadeKey === k).sort((a, b) => a.tier - b.tier);
      return { title: levels[0].groupTitle, sub: levels[0].decade, blurb: levels[0].groupBlurb, art: levels[0].instrument, color: levels[0].color, tiered: true, levels };
    });
  }
  const byLevel = th.levels.filter(l => l.group !== "style"), byStyle = th.levels.filter(l => l.group === "style");
  if (!byStyle.length) return [{ title: "Le programme", levels: th.levels }];
  return [{ title: "Par niveau", levels: byLevel }, { title: "Par style", levels: byStyle }];
}
const playOrder = th => groupsOf(th).flatMap(g => g.levels);
const TIER_NAMES = ["", "Facile", "Moyen", "Difficile"];
function renderTheme(th) {
  S.screen = "theme"; S.theme = th;
  $app.style.setProperty("--lvl", th.color);
  const n = th.levels[0].tracks.length;
  $app.innerHTML = `
    <div class="topbar"><button class="back" id="back">← Salles</button><span class="eyebrow">${DUO ? `Duo · ${esc(DUO.names[0])} contre ${esc(DUO.names[1])}` : th.eyebrow}</span></div>
    <header class="room-head" style="--lvl:${th.color}">
      <div><p class="eyebrow">Blind Test</p><h1 class="room-title">${th.name}</h1><p class="tag">${th.tagline}</p></div>
      <div class="room-art lg">${ART[th.hero](th.color)}</div>
    </header>
    ${groupsOf(th).map((g, gi) => g.tiered ? `<section aria-labelledby="sets-h${gi}" class="stack decade-group" style="--lvl:${g.color}">
      <div class="decade-head">
        <span class="decade-art">${ART[g.art](g.color)}</span>
        <div><h2 id="sets-h${gi}">${g.title}</h2><span class="eyebrow">${g.sub} · 3 niveaux</span><p class="blurb">${g.blurb || ""}</p></div>
      </div>
      <ol class="sets tiers">
        ${g.levels.map(l => {
          const b = best[bkey(th, l)];
          return `<li><button class="set tier" style="--lvl:${l.color}" data-level="${l.id}">
            <span class="txt"><span class="num">NIVEAU ${l.tier}</span><h3>${TIER_NAMES[l.tier]}</h3><span class="blurb">${l.blurb}</span></span>
            <span class="meta">
              <span class="diff" aria-label="Difficulté ${l.tier} sur 3">${[1,2,3].map(i => `<i class="${i <= l.tier ? "on" : ""}"></i>`).join("")}</span>
              ${b ? `${starStr(starsFor(b.correct, b.total || 5))}<span class="best mono">${b.points} pts</span>` : `<span class="best">Pas encore joué</span>`}
            </span>
          </button></li>`;
        }).join("")}
      </ol>
    </section>` : `<section aria-labelledby="sets-h${gi}" class="stack">
      <div class="section-head">
        <h2 id="sets-h${gi}">${g.title}</h2>
        <span class="eyebrow">${g.levels.length} sets · ${n} morceaux chacun</span>
      </div>
      <ol class="sets">
        ${g.levels.map(l => {
          const b = best[bkey(th, l)];
          return `<li><button class="set" style="--lvl:${l.color}" data-level="${l.id}">
            <span class="art">${ART[l.instrument](l.color)}</span>
            <span class="txt"><span class="num">SET ${pad2(l.id)}</span><h3>${l.name}</h3><span class="blurb">${l.blurb}</span></span>
            <span class="meta">
              ${l.group === "style" ? `<span class="decade mono">Style</span>`
                : `<span class="diff" aria-label="Difficulté ${l.id} sur 5">${[1,2,3,4,5].map(i => `<i class="${i <= l.id ? "on" : ""}"></i>`).join("")}</span>`}
              ${b ? `${starStr(starsFor(b.correct, b.total || 5))}<span class="best mono">${b.points} pts</span>` : `<span class="best">Pas encore joué</span>`}
            </span>
          </button></li>`;
        }).join("")}
      </ol>
    </section>`).join("")}`;
  $app.querySelector("#back").addEventListener("click", renderHome);
  $app.querySelectorAll(".set").forEach(b => b.addEventListener("click", () => { unlockAudio(); startLevel(+b.dataset.level); }));
  window.scrollTo({ top: 0 });
}

function startLevel(id) {
  S.level = S.theme.levels.find(l => l.id === id);
  S.order = shuffle(S.level.tracks);
  S.qi = 0; S.score = 0; S.results = [];
  S.players = DUO ? DUO.names.map(name => ({ name, score: 0, correct: 0 })) : null;
  window.scrollTo({ top: 0 });
  newQuestion();
}

/* Cycle d'une question : loading → (lecture auto) playing ⇄ paused → answered.
   Si le navigateur bloque la lecture auto : idle, en attente du bouton. */
function newQuestion() {
  const t = S.order[S.qi];
  S.choices = shuffle([{ title: t.title, artist: t.artist, ok: true }, ...t.decoys.map(([title, artist]) => ({ title, artist, ok: false }))]);
  S.phase = S.players ? "handoff" : "loading"; S.picked = null; S.clip = undefined; S.elapsed = 0; S.simulated = false;
  S.simMsg = "Recherche de l'extrait sur Deezer…";
  const token = ++S.token;
  renderGame();
  getPreview(t).then(c => { if (token === S.token) { S.clip = c; autoStart(token); } });
  if (S.phase === "handoff") { const go = document.getElementById("go"); go && go.focus(); }
}
function startTurn() { // clic « C'est parti » : débloque l'audio puis lance l'extrait
  if (S.phase !== "handoff") return;
  unlockAudio();
  S.phase = "loading"; renderGame();
  if (S.clip !== undefined) autoStart(S.token);
}

async function autoStart(token) {
  if (S.phase !== "loading") return;
  if (!S.clip) { startCrackle(); beginTimer("Extrait introuvable sur Deezer · simulé", true); return; }
  try {
    await playClip(S.clip.url);
    if (token !== S.token || S.phase !== "loading") { stopClip(); return; }
    beginTimer("Extrait Deezer · 30 secondes", false);
  } catch (e) {
    if (token !== S.token) return;
    S.phase = "idle"; S.simMsg = "Le navigateur a bloqué la lecture automatique : appuie sur Lancer.";
    renderGame(); focusPlay();
  }
}

function beginTimer(msg, simulated) {
  S.phase = "playing"; S.simMsg = msg; S.simulated = simulated; S.t0 = performance.now();
  renderGame(); focusPlay();
  say("Extrait lancé. Quatre réponses disponibles.");
  tick();
}

function onPlayButton() {
  if (S.phase === "idle") {
    if (S.clip) playClip(S.clip.url).then(() => beginTimer("Extrait Deezer · 30 secondes", false)).catch(() => { startCrackle(); beginTimer("Lecture impossible · extrait simulé", true); });
    else { startCrackle(); beginTimer("Extrait introuvable sur Deezer · simulé", true); }
  } else if (S.phase === "playing") pauseRound();
  else if (S.phase === "paused") resumeRound();
}
function pauseRound() {
  cancelAnimationFrame(S.raf);
  S.elapsed += (performance.now() - S.t0) / 1000;
  if (S.simulated) stopCrackle(); else player.pause();
  S.phase = "paused"; renderGame(); focusPlay(); say("Pause.");
}
function resumeRound() {
  if (S.simulated) startCrackle(); else { const p = player.play(); if (p) p.catch(() => {}); }
  S.phase = "playing"; S.t0 = performance.now();
  renderGame(); focusPlay(); tick();
}
const leftNow = () => Math.max(0, ROUND_SECONDS - S.elapsed - (S.phase === "playing" ? (performance.now() - S.t0) / 1000 : 0));
function tick() {
  const left = leftNow();
  const clock = document.getElementById("clock"), bar = document.getElementById("bar");
  if (clock) clock.textContent = "00:" + pad2(Math.ceil(left));
  if (bar) bar.style.transform = `scaleX(${left / ROUND_SECONDS})`;
  if (left <= 0) { answer(null); return; }
  S.raf = requestAnimationFrame(tick);
}
function stopRound() { cancelAnimationFrame(S.raf); stopCrackle(); stopClip(); }
function focusPlay() { const p = document.getElementById("play"); if (p && !p.disabled) p.focus(); }

function renderGame() {
  S.screen = "game";
  const th = S.theme, l = S.level, t = S.order[S.qi], n = S.order.length;
  const ph = S.phase, answered = ph === "answered", live = ph === "playing" || ph === "paused";
  const res = S.results[S.qi];
  const left = answered ? 0 : leftNow();
  const btn = {
    loading: ["Chargement…", PLAY_ICO, true], idle: ["Lancer l'extrait", PLAY_ICO, false],
    playing: ["Pause", PAUSE_ICO, false], paused: ["Reprendre", PLAY_ICO, false], answered: ["Extrait terminé", PLAY_ICO, true]
  }[ph];
  $app.style.setProperty("--lvl", l.color);
  $app.innerHTML = `
    <div class="topbar">
      <button class="back" id="back">← ${th.name}</button>
      ${S.players
        ? `<div class="duo-score" aria-label="Scores">${S.players.map((p, i) => `<span class="pl ${i === turnOf(S.qi) ? "on" : ""}"><span class="nm">${esc(p.name)}</span><span class="val mono">${p.score}</span></span>`).join("")}</div>`
        : `<div class="scorebox"><span class="eyebrow">Score</span><div class="val mono">${S.score}</div></div>`}
    </div>
    <div class="level-title">
      <span class="eyebrow">${l.tier ? `Niveau ${l.tier}` : `Set ${pad2(l.id)}`} · Morceau ${S.qi + 1} sur ${n}</span>
      <h2>${l.name}</h2>
      <div class="dots" aria-hidden="true">${S.order.map((_, i) => `<span class="${i < S.results.length ? (S.results[i].ok ? "ok" : "ko") : i === S.qi ? "cur" : ""}"></span>`).join("")}</div>
    </div>
    ${ph === "handoff" ? `
    <section class="handoff">
      <span class="eyebrow">Morceau ${S.qi + 1} sur ${n} · ${esc(S.players[turnOf(S.qi)].name)} joue</span>
      <h2 id="ho-h">À toi, ${esc(S.players[turnOf(S.qi)].name)} !</h2>
      <p class="tag">Prends le téléphone. L'extrait démarre dès que tu appuies.</p>
      <button class="play" id="go"><span class="ico">${PLAY_ICO}</span>C'est parti</button>
    </section>` : `
    <section class="stage" aria-label="Platine">
      <div class="deck">
        <div class="disc ${ph === "playing" ? "spinning" : ""}">${vinyl(l.color)}</div>
        <div class="arm ${live ? "down" : ""}">${ARM}</div>
      </div>
      <div class="controls">
        <button class="play ${ph === "playing" ? "is-pause" : ""}" id="play" ${btn[2] ? "disabled" : ""} aria-label="${btn[0]}">
          <span class="ico">${btn[1]}</span>${btn[0]}
        </button>
        <div class="timer">
          <div class="row"><span>${ph === "paused" ? "En pause" : "Temps restant"}</span><span class="clock mono" id="clock">00:${pad2(Math.ceil(left))}</span></div>
          <div class="bar"><i id="bar" style="transform:scaleX(${left / ROUND_SECONDS})"></i></div>
        </div>
        <p class="sim" id="sim">${S.simMsg}</p>
      </div>
    </section>`}
    ${!live && !answered && ph !== "handoff" ? `<p class="hint">${ph === "loading" ? "L'extrait démarre tout seul." : "Lance l'extrait pour débloquer les réponses."} Raccourcis : 1 à 4 pour répondre, P pour la pause.</p>` : ""}
    ${ph === "handoff" ? "" : `<ol class="choices ${!live && !answered ? "locked" : ""}" aria-label="Quel est ce morceau ?">
      ${S.choices.map((c, i) => {
        let cls = "";
        if (answered && c.ok) cls = "is-ok";
        else if (answered && S.picked === i && !c.ok) cls = "is-ko";
        return `<li><button class="choice ${cls}" data-i="${i}" ${!live ? "disabled" : ""}>
          <span class="k">${i + 1}</span><span class="t"><span class="title">${c.title}</span><span class="artist">${c.artist}</span></span>
        </button></li>`;
      }).join("")}
    </ol>`}
    ${answered ? `
      <section class="feedback ${res.ok ? "ok" : "ko"}">
        <h3 tabindex="-1" id="fb-h">${S.players ? (res.ok ? `Bien joué, ${esc(S.players[res.player].name)} !` : res.timeout ? `Temps écoulé pour ${esc(S.players[res.player].name)}` : `Raté, ${esc(S.players[res.player].name)}`) : res.ok ? "Bien joué !" : res.timeout ? "Temps écoulé" : "Raté"}</h3>
        <div class="reveal">
          ${S.clip && S.clip.cover ? `<img src="${S.clip.cover}" alt="Pochette de l'album ${S.clip.album || ""}" width="72" height="72">` : ""}
          <div class="reveal-t">
            <p class="answer">${t.title} <span>· ${t.artist}${t.year ? ` · ${th.yearLabel} ${t.year}` : ""}</span></p>
            ${S.clip && S.clip.link ? `<a class="dz" href="${S.clip.link}" target="_blank" rel="noopener">Écouter en entier sur Deezer ↗</a>` : ""}
          </div>
        </div>
        <p class="fact">${t.fact}</p>
        <p class="pts mono">${res.ok ? `+${res.points} pts (dont ${res.points - BASE_POINTS} de bonus vitesse)` : "+0 pt"}</p>
        <button class="next" id="next">${S.qi + 1 < n ? (S.players ? `Au tour de ${esc(S.players[turnOf(S.qi + 1)].name)} →` : "Morceau suivant →") : "Voir le résultat →"}</button>
      </section>` : ""}`;

  $app.querySelector("#back").addEventListener("click", () => { stopRound(); S.token++; S.phase = "idle"; renderTheme(th); });
  const play = $app.querySelector("#play"); if (play) play.addEventListener("click", onPlayButton);
  const go = $app.querySelector("#go"); if (go) go.addEventListener("click", startTurn);
  $app.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
  const next = $app.querySelector("#next");
  if (next) next.addEventListener("click", () => { unlockAudio(); goNext(); });
}

function answer(i) {
  if (S.phase !== "playing" && S.phase !== "paused") return;
  const left = leftNow();
  stopRound();
  const ok = i !== null && S.choices[i].ok;
  const points = ok ? BASE_POINTS + Math.round(left) * BONUS_PER_SEC : 0;
  S.score += points; S.picked = i; S.phase = "answered";
  const player = turnOf(S.qi);
  if (S.players) { S.players[player].score += points; if (ok) S.players[player].correct++; }
  S.results.push({ ok, points, timeout: i === null, player });
  renderGame();
  const t = S.order[S.qi];
  say(`${ok ? "Bonne réponse" : "Mauvaise réponse"}. C'était ${t.title}, de ${t.artist}.`);
  const h = document.getElementById("fb-h"); h && h.focus();
}
function goNext() {
  if (S.qi + 1 < S.order.length) { S.qi++; newQuestion(); }
  else renderResult();
}

function renderResult() {
  if (S.players) return renderDuoResult();
  S.screen = "result";
  const th = S.theme, l = S.level, total = S.order.length, correct = S.results.filter(r => r.ok).length, stars = starsFor(correct, total);
  const k = bkey(th, l), prev = best[k];
  const isRecord = !prev || S.score > prev.points;
  if (isRecord) { best[k] = { points: S.score, correct, total }; saveBest(best); }
  const vi = correct === total ? 5 : Math.min(4, Math.floor(correct / total * 5));
  const verdict = ["Le DJ a fait une pause.", "Encore quelques disques à écouter.", "Pas mal du tout.", "Belle oreille.", "Presque parfait.", "Un sans-faute. Le club t'offre un verre."][vi];
  const order = playOrder(th), nextLevel = order[order.indexOf(l) + 1];
  $app.innerHTML = `
    <div class="topbar"><button class="back" id="back">← ${th.name}</button><span class="eyebrow">Fin du ${l.tier ? `niveau ${l.tier}` : `set ${pad2(l.id)}`}</span></div>
    <section class="result-card" style="--lvl:${l.color}">
      <div class="stack" style="gap:8px">
        <span class="eyebrow">${th.name} · ${l.name}</span>
        <div class="big mono" style="font-family:var(--f-display)">${S.score}<span style="font-size:.4em;color:var(--smoke)"> pts</span></div>
        <div>${starStr(stars)}</div>
        <p class="verdict" tabindex="-1" id="verdict">${correct} sur ${total} trouvés. ${verdict}</p>
        ${isRecord ? `<span class="chip" style="align-self:flex-start">Nouveau record</span>` : `<span class="best">Record : ${prev.points} pts</span>`}
      </div>
      <div class="art">${ART[l.instrument](l.color)}</div>
    </section>
    <section class="stack" style="gap:10px">
      <h2 style="font-size:24px">La setlist</h2>
      <ol class="recap">
        ${S.order.map((t, i) => { const r = S.results[i]; return `<li>
          <span class="mark ${r.ok ? "ok" : "ko"}" aria-label="${r.ok ? "Trouvé" : "Raté"}">${r.ok ? "✓" : "✕"}</span>
          <span class="t">${t.title} <span>· ${t.artist}${t.year ? ` (${t.year})` : ""}</span></span>
          <span class="p mono">${r.points}</span></li>`; }).join("")}
      </ol>
    </section>
    <div class="actions">
      <button class="btn primary" id="again">Rejouer ce set</button>
      ${nextLevel ? `<button class="btn" id="nextlvl">Set suivant : ${nextLevel.name}</button>` : ""}
    </div>`;
  $app.querySelector("#back").addEventListener("click", () => renderTheme(th));
  $app.querySelector("#again").addEventListener("click", () => { unlockAudio(); startLevel(l.id); });
  const nl = $app.querySelector("#nextlvl"); nl && nl.addEventListener("click", () => { unlockAudio(); startLevel(nextLevel.id); });
  window.scrollTo({ top: 0 });
  document.getElementById("verdict").focus();
}

function renderDuoResult() {
  S.screen = "result";
  const th = S.theme, l = S.level, P = S.players;
  const per = P.map((_, i) => S.results.filter(r => r.player === i).length);
  const ranked = P.map((p, i) => ({ ...p, i })).sort((a, b) => b.score - a.score);
  const tie = ranked[0].score === ranked[1].score;
  const head = tie ? "Égalité !" : `${esc(ranked[0].name)} gagne !`;
  const sub = tie ? `${ranked[0].score} points chacun. Il va falloir une revanche.` : `${ranked[0].score} points contre ${ranked[1].score}.`;
  const order = playOrder(th), nextLevel = order[order.indexOf(l) + 1];
  $app.innerHTML = `
    <div class="topbar"><button class="back" id="back">← ${th.name}</button><span class="eyebrow">Duo · fin du ${l.tier ? `niveau ${l.tier}` : `set ${pad2(l.id)}`}</span></div>
    <section class="result-card" style="--lvl:${l.color}">
      <div class="stack" style="gap:8px">
        <span class="eyebrow">${th.name} · ${l.name}</span>
        <div class="big" style="font-family:var(--f-display)" tabindex="-1" id="verdict">${head}</div>
        <p class="verdict">${sub}</p>
        <ol class="podium">${ranked.map((p, k) => `<li class="${!tie && k === 0 ? "win" : ""}">
          <span class="nm">${esc(p.name)}</span><span class="mono">${p.correct} / ${per[p.i]} trouvés</span><span class="mono pts">${p.score} pts</span></li>`).join("")}</ol>
      </div>
      <div class="art">${ART[l.instrument](l.color)}</div>
    </section>
    <section class="stack" style="gap:10px">
      <h2 style="font-size:24px">La setlist</h2>
      <ol class="recap duo">
        ${S.order.map((t, i) => { const r = S.results[i]; return `<li>
          <span class="mark ${r.ok ? "ok" : "ko"}" aria-label="${r.ok ? "Trouvé" : "Raté"}">${r.ok ? "✓" : "✕"}</span>
          <span class="t">${t.title} <span>· ${t.artist}${t.year ? ` (${t.year})` : ""}</span><span class="who">${esc(P[r.player].name)}</span></span>
          <span class="p mono">${r.points}</span></li>`; }).join("")}
      </ol>
    </section>
    <div class="actions">
      <button class="btn primary" id="again">Revanche sur ce set</button>
      ${nextLevel ? `<button class="btn" id="nextlvl">Set suivant : ${nextLevel.name}</button>` : ""}
    </div>
    <p class="best">En Duo, les scores ne comptent pas dans tes records solo.</p>`;
  $app.querySelector("#back").addEventListener("click", () => renderTheme(th));
  $app.querySelector("#again").addEventListener("click", () => { unlockAudio(); startLevel(l.id); });
  const nl = $app.querySelector("#nextlvl"); nl && nl.addEventListener("click", () => { unlockAudio(); startLevel(nextLevel.id); });
  window.scrollTo({ top: 0 });
  document.getElementById("verdict").focus();
}

document.addEventListener("keydown", e => {
  if (S.screen !== "game" || e.altKey || e.ctrlKey || e.metaKey) return;
  if ((e.key === "p" || e.key === "P") && (S.phase === "playing" || S.phase === "paused")) { e.preventDefault(); onPlayButton(); return; }
  if (S.phase !== "playing" && S.phase !== "paused") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) { e.preventDefault(); answer(n - 1); }
});

renderHome();
</script>
</body>
</html>
