<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15131e">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Blind Test">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Blind Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : une colonne façon « carte de club » centrée, enseigne lumineuse en tête, sets empilés comme un programme de soirée. Thème unique : club de nuit. */
:root {
  --night: #15131e;
  --velvet: #221c30;
  --curtain: #5e1a26;
  --brass: #e0b04f;
  --brass-deep: #9c7228;
  --cream: #f3e6c8;
  --smoke: #a8a0ba;
  --line: #3a3150;
  --ok: #73c98f;
  --ko: #ee6b73;
  --f-display: "Abril Fatface", "Playfair Display", Georgia, serif;
  --f-body: "Karla", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background:
    radial-gradient(ellipse 70% 40% at 50% -5%, rgba(224,176,79,.16), transparent 70%),
    radial-gradient(ellipse 60% 50% at 100% 100%, rgba(94,26,38,.45), transparent 70%),
    var(--night);
  background-attachment: fixed;
  color: var(--cream);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
.app {
  max-width: 680px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 28px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--smoke); font-weight: 700; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }

/* ——— Enseigne ——— */
.marquee {
  position: relative;
  border: 2px solid var(--brass);
  border-radius: 20px;
  padding: 26px 22px 22px;
  background: linear-gradient(180deg, rgba(94,26,38,.55), rgba(34,28,48,.9));
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
  overflow: hidden;
}
.bulbs { position: absolute; inset: 7px; pointer-events: none; border-radius: 14px;
  background-image: radial-gradient(circle, var(--brass) 2px, transparent 2.6px);
  background-size: 18px 18px; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  padding: 5px; opacity: .55; animation: twinkle 2.4s steps(2) infinite; }
@keyframes twinkle { 50% { opacity: .9; } }
.marquee h1 { font-size: clamp(40px, 11vw, 64px); line-height: .95; color: var(--cream); }
.marquee h1 em { font-style: normal; color: var(--brass); display: block; }
.marquee .tag { margin-top: 10px; color: var(--smoke); max-width: 30ch; }
.hero-vinyl { width: clamp(96px, 26vw, 150px); }
.hero-vinyl svg { width: 100%; height: auto; display: block; animation: spin 6s linear infinite; }

/* ——— Liste des sets ——— */
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 28px; }
.sets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.set {
  width: 100%; text-align: left;
  display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; align-items: center;
  background: var(--velvet); border: 1px solid var(--line); border-radius: 16px;
  padding: 12px 16px 12px 12px;
  transition: transform .15s ease, border-color .15s ease;
}
.set:hover { transform: translateY(-2px); border-color: var(--lvl); }
.set .art { width: 72px; height: 72px; }
.set .art svg { width: 100%; height: 100%; display: block; }
.set .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.set .num { font-family: var(--f-mono); font-size: 12px; color: var(--lvl); letter-spacing: .08em; }
.set h3 { font-size: 21px; line-height: 1.15; }
.set .blurb { color: var(--smoke); font-size: 14px; }
.set .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.diff { display: flex; gap: 3px; }
.diff i { width: 7px; height: 14px; border-radius: 2px; background: var(--line); }
.diff i.on { background: var(--lvl); }
.best { font-size: 12px; color: var(--smoke); white-space: nowrap; }
.stars { color: var(--brass); letter-spacing: 2px; font-size: 14px; }
.stars .off { color: var(--line); }

.foot-note { font-size: 13px; color: var(--smoke); display: flex; gap: 10px; align-items: flex-start;
  border-top: 1px dashed var(--line); padding-top: 16px; }
.foot-note .chip { flex: none; }
.chip { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  border: 1px solid var(--brass-deep); color: var(--brass); padding: 3px 8px; border-radius: 999px; }

/* ——— Partie ——— */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--smoke); }
.back:hover { color: var(--cream); border-color: var(--smoke); }
.scorebox { text-align: right; }
.scorebox .val { font-size: 22px; color: var(--brass); }
.level-title { display: flex; flex-direction: column; gap: 4px; }
.level-title h2 { font-size: clamp(28px, 7vw, 38px); }
.dots { display: flex; gap: 6px; margin-top: 6px; }
.dots span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.dots span.ok { background: var(--ok); }
.dots span.ko { background: var(--ko); }
.dots span.cur { background: var(--lvl); }

.stage {
  position: relative; border-radius: 22px; padding: 20px;
  background: linear-gradient(160deg, #2b2340, #1a1626);
  border: 1px solid var(--line);
  display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center;
}
.deck { position: relative; width: clamp(130px, 36vw, 180px); aspect-ratio: 1; max-width: 100%; }
.deck .disc { width: 100%; height: 100%; display: block; }
.deck .disc.spinning { animation: spin 1.8s linear infinite; }
.deck .arm { position: absolute; width: 46%; right: -10%; top: -6%; transform-origin: 78% 12%;
  transform: rotate(-26deg); transition: transform .6s cubic-bezier(.3,1.4,.5,1); }
.deck .arm.down { transform: rotate(0deg); }
@keyframes spin { to { transform: rotate(360deg); } }
.controls { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.play {
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--brass); color: #231a08; border: none; border-radius: 999px;
  padding: 12px 22px 12px 14px; font-weight: 700; font-size: 17px;
  box-shadow: 0 6px 0 var(--brass-deep);
  transition: transform .1s ease, box-shadow .1s ease;
}
.play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--brass-deep); }
.play .ico { width: 30px; height: 30px; border-radius: 50%; background: #231a08; display: grid; place-items: center; }
.play .ico svg { width: 12px; height: 12px; }
.play[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; }
.timer { display: flex; flex-direction: column; gap: 6px; }
.timer .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--smoke); }
.timer .clock { color: var(--cream); font-size: 15px; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--lvl); transform-origin: left; }
.sim { font-size: 12px; color: var(--smoke); }

.choices { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice {
  width: 100%; height: 100%; text-align: left;
  display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start;
  background: var(--velvet); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  transition: border-color .15s ease, background .15s ease, transform .1s ease;
}
.choice:not([disabled]):hover { border-color: var(--lvl); transform: translateY(-1px); }
.choice .k { font-family: var(--f-mono); font-size: 13px; width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center; border: 1px solid var(--line); color: var(--smoke); }
.choice .t { min-width: 0; display: flex; flex-direction: column; }
.choice .title { font-weight: 700; font-size: 16px; line-height: 1.25; }
.choice .artist { color: var(--smoke); font-size: 14px; }
.choice[disabled] { cursor: default; }
.choices.locked .choice { opacity: .45; filter: blur(.6px); }
.choice.is-ok { border-color: var(--ok); background: rgba(115,201,143,.12); opacity: 1 !important; filter: none !important; }
.choice.is-ok .k { background: var(--ok); color: #10251a; border-color: var(--ok); }
.choice.is-ko { border-color: var(--ko); background: rgba(238,107,115,.12); opacity: 1 !important; filter: none !important; }
.choice.is-ko .k { background: var(--ko); color: #2c0d10; border-color: var(--ko); }
.hint { text-align: center; color: var(--smoke); font-size: 14px; }

.feedback { scroll-margin-bottom: 16px;

  border-radius: 18px; padding: 18px 20px; border: 1px solid var(--line);
  background: var(--velvet); display: flex; flex-direction: column; gap: 10px;
}
.feedback.ok { border-color: var(--ok); }
.feedback.ko { border-color: var(--ko); }
.feedback h3 { font-size: 26px; }
.feedback.ok h3 { color: var(--ok); }
.feedback.ko h3 { color: var(--ko); }
.feedback .answer { font-weight: 700; }
.feedback .answer span { color: var(--smoke); font-weight: 400; }
.feedback .fact { color: var(--smoke); font-size: 15px; }
.reveal { display: flex; gap: 14px; align-items: center; }
.reveal img { width: 72px; height: 72px; border-radius: 8px; flex: none; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.reveal-t { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.dz { color: var(--brass); font-size: 14px; }
.notes { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.notes div { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: baseline; padding-top: 8px; border-top: 1px dashed var(--line); }
.notes dt { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--lvl); }
.notes dd { margin: 0; font-size: 15px; color: var(--cream); line-height: 1.45; min-width: 0; }
@media (max-width: 420px) { .notes div { grid-template-columns: 1fr; gap: 2px; } }
.feedback .pts { font-size: 14px; color: var(--brass); }
.next { align-self: flex-end; background: var(--cream); color: var(--night); border: none; border-radius: 999px;
  padding: 10px 20px; font-weight: 700; }

/* ——— Résultat ——— */
.result-card { border: 2px solid var(--lvl); border-radius: 22px; padding: 24px 22px;
  background: linear-gradient(180deg, rgba(94,26,38,.4), var(--velvet));
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.result-card .big { font-family: var(--f-display); font-size: clamp(48px, 14vw, 72px); line-height: 1; color: var(--brass); }
.result-card .verdict { font-size: 18px; }
.result-card .stars { font-size: 26px; }
.result-card .art { width: clamp(90px, 24vw, 120px); }
.result-card .art svg { width: 100%; height: auto; display: block; }
.recap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.recap li { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.recap .mark { font-weight: 700; }
.recap .mark.ok { color: var(--ok); }
.recap .mark.ko { color: var(--ko); }
.recap .t { min-width: 0; }
.recap .t span { color: var(--smoke); }
.recap .p { font-size: 14px; color: var(--brass); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border-radius: 999px; padding: 11px 20px; font-weight: 700; border: 1px solid var(--line); background: var(--velvet); }
.btn.primary { background: var(--brass); color: #231a08; border-color: var(--brass); }

@media (max-width: 560px) {
  .choices { grid-template-columns: 1fr; }
  .stage { grid-template-columns: 1fr; justify-items: center; }
  .controls { width: 100%; }
  .play { align-self: center; }
  .set { grid-template-columns: 56px 1fr; }
  .set .art { width: 56px; height: 56px; }
  .set .meta { grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px; }
  .result-card { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ——— Salles & thèmes ——— */
.stack { display: flex; flex-direction: column; gap: 14px; }
.marquee h1 em { display: inline; }
.rooms { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.room { width: 100%; height: 100%; text-align: left; display: flex; flex-direction: column; gap: 14px;
  background: var(--velvet); border: 1px solid var(--line); border-radius: 20px; padding: 18px;
  transition: transform .15s ease, border-color .15s ease; }
.room:hover { transform: translateY(-3px); border-color: var(--lvl); }
.room-art { width: 88px; height: 88px; flex: none; }
.room-art svg { width: 100%; height: 100%; display: block; }
.room-txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.room .num { font-family: var(--f-mono); font-size: 12px; color: var(--lvl); letter-spacing: .08em; text-transform: uppercase; }
.room h3 { font-size: 30px; line-height: 1.05; }
.room .blurb { color: var(--smoke); font-size: 14px; }
.room-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.room-head { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; border-bottom: 1px dashed var(--line); padding-bottom: 20px; }
.room-title { font-size: clamp(40px, 11vw, 60px); line-height: .95; color: var(--lvl); margin-top: 4px; }
.room-head .tag { margin-top: 10px; color: var(--smoke); max-width: 40ch; }
.room-art.lg { width: clamp(90px, 24vw, 130px); height: auto; }
.decade { font-size: 12px; color: var(--lvl); white-space: nowrap; }
.decade-group { border-top: 1px dashed var(--line); padding-top: 20px; }
.room-head + .decade-group { border-top: 0; padding-top: 0; }
.decade-head { align-items: flex-start; }
.back { white-space: nowrap; flex: none; }
.topbar .eyebrow { text-align: right; min-width: 0; }
.decade-head { display: flex; gap: 14px; align-items: center; }
.decade-head h2 { font-size: 28px; color: var(--lvl); }
.decade-head .blurb { color: var(--smoke); font-size: 14px; margin-top: 2px; }
.decade-art { width: 60px; height: 60px; flex: none; }
.decade-art svg { width: 100%; height: 100%; display: block; }
.sets.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.set.tier { grid-template-columns: 1fr; height: 100%; align-content: space-between; padding: 14px; }
.set.tier h3 { font-size: 22px; }
.set.tier .meta { align-items: flex-start; }
@media (max-width: 560px) {
  .sets.tiers { grid-template-columns: 1fr; }
  .set.tier { grid-template-columns: 1fr auto; align-items: center; }
  .set.tier .meta { grid-column: auto; flex-direction: column; align-items: flex-end; }
}
.play.is-pause { background: var(--cream); }
.install { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 16px; background: var(--velvet); border: 1px solid var(--line); }
.install-ico { width: 56px; height: 56px; } .install-ico svg { width: 100%; height: 100%; display: block; }
.install-t { min-width: 0; } .install h2 { font-size: 20px; } .install p { color: var(--smoke); font-size: 14px; }
@media (max-width: 480px) { .install { grid-template-columns: 48px 1fr; } .install .btn { grid-column: 1 / -1; } }
.src { font-size: 12px; color: var(--smoke); margin-top: 2px; } .src a { color: var(--lvl); }
.rank { align-self: flex-start; font-size: 13px; font-weight: 700; color: #15131e; background: var(--lvl); border-radius: 999px; padding: 4px 12px; }
.demo-note { border: 1px solid var(--brass-deep); border-radius: 14px; padding: 12px 14px; font-size: 14px; color: var(--cream); background: var(--velvet); }
.demo-note a { color: var(--brass); overflow-wrap: anywhere; }
/* ——— Duo ——— */
.modes { display: flex; flex-direction: column; gap: 10px; }
.seg { display: inline-flex; align-self: flex-start; padding: 4px; gap: 4px; border-radius: 999px; background: var(--velvet); border: 1px solid var(--line); }
.seg-b { border: none; background: none; border-radius: 999px; padding: 8px 22px; font-weight: 700; color: var(--smoke); }
.seg-b.on { background: var(--brass); color: #231a08; }
.mode-line { color: var(--smoke); font-size: 14px; }
.mode-line strong { color: var(--cream); }
.linkish { background: none; border: none; padding: 0; color: var(--brass); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.duo-form { display: flex; flex-direction: column; gap: 16px; max-width: 420px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.answer-mode { display: flex; flex-direction: column; gap: 8px; }
.voice { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.mic { display: inline-flex; align-items: center; gap: 10px; flex: none; border-radius: 999px; padding: 10px 18px 10px 12px;
  background: var(--velvet); border: 1px solid var(--line); color: var(--cream); font-weight: 700;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
.mic .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--pc, var(--lvl)) 25%, transparent); }
.mic svg { width: 16px; height: 16px; }
.mic:not([disabled]):hover { border-color: var(--pc, var(--lvl)); }
.mic[disabled] { opacity: .45; }
.mic.on { border-color: var(--ko); background: rgba(238,107,115,.14); }
.mic.on .dot { background: var(--ko); animation: micpulse 1.1s ease-in-out infinite; }
.mic.on svg path, .mic.on svg rect { fill: #2c0d10; }
@keyframes micpulse { 50% { box-shadow: 0 0 0 7px rgba(238,107,115,.25); } }
@media (prefers-reduced-motion: reduce) { .mic.on .dot { animation: none; } }
.fb-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.fb-actions .voice { flex: 1 1 auto; }
.fb-actions .next { margin-left: auto; }
.voice-msg { margin: 0; font-size: 14px; color: var(--smoke); min-width: 0; }
.voice-msg q { color: var(--cream); }
.type-ans { display: flex; flex-direction: column; gap: 8px; }
.type-ans label { font-weight: 700; }
.type-row { display: flex; gap: 8px; }
.type-row input { flex: 1; min-width: 0; font: inherit; font-size: 18px; color: var(--cream); background: var(--velvet); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.type-row input:focus-visible { outline: none; border-color: var(--pc, var(--lvl)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc, var(--lvl)) 35%, transparent); }
.type-row input:disabled { opacity: .55; }
.type-ans.locked .type-row input { opacity: .45; }
.type-ans.is-ok .type-row input { border-color: var(--ok); background: rgba(115,201,143,.12); opacity: 1; }
.type-ans.is-ko .type-row input { border-color: var(--ko); background: rgba(238,107,115,.12); opacity: 1; }
.type-row .btn { flex: none; }
.type-msg { min-height: 1.4em; margin: 0; font-size: 14px; color: var(--smoke); }
.type-msg.ko { color: var(--ko); }
.type-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.type-row.shake { animation: shake .32s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .type-row.shake { animation: none; } }
.field label { font-weight: 700; }
.field input { font: inherit; color: var(--cream); background: var(--velvet); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.field input:focus-visible { border-color: var(--brass); }
.field input[aria-invalid="true"] { border-color: var(--ko); }
.err { color: var(--ko); font-weight: 700; }
.duo-score { display: flex; gap: 8px; }
.duo-score .pl { display: flex; flex-direction: column; align-items: flex-end; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--line); min-width: 0; }
.duo-score .pl.on { border-color: var(--lvl); background: var(--velvet); }

.turn-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--pc) 30%, transparent); animation: pulse 1.6s ease-in-out infinite; }

.stage.duo, .quiz-card.duo { border: 2px solid var(--pc); }
.duo-score .pl.on { background: var(--pc); border-color: var(--pc); }
.duo-score .pl.on .nm, .duo-score .pl.on .val { color: #15131e; }
.quiz-card { border-radius: 22px; padding: 20px; background: linear-gradient(160deg, #2b2340, #1a1626); border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 14px; }

.qimg { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.qimg img { display: block; width: 100%; max-height: 340px; object-fit: contain; border-radius: 14px; background: #0d0c14; }

.clue { color: var(--cream); background: var(--velvet); border-radius: 12px; padding: 12px 14px; }

.rooms { grid-template-columns: repeat(3, minmax(0, 1fr)); }

.podium { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

/* ===================== API Deezer =====================
   1. Sur Netlify : /api/deezer/* est redirigé vers api.deezer.com (voir netlify.toml), donc fetch classique.
   2. Ailleurs (fichier ouvert en local) : repli en JSONP, que Deezer accepte avec output=jsonp.
   Les liens d'extraits expirent : on les cherche au moment de jouer, jamais stockés. */
const PREVIEW_CACHE = new Map();
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

function jsonp(url, ms = 6000) {
  return new Promise((resolve, reject) => {
    const cb = "dz_cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const done = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); reject(new Error("timeout")); }, ms);
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error("jsonp")); };
    s.src = url + (url.includes("?") ? "&" : "?") + "output=jsonp&callback=" + cb;
    document.head.appendChild(s);
  });
}
async function deezer(path) {
  if (/netlify\.app$/.test(location.hostname)) try {
    const r = await fetch("/api/deezer" + path, { headers: { Accept: "application/json" } });
    const type = r.headers.get("content-type") || "";
    if (r.ok && type.includes("json")) return await r.json();
  } catch (e) {}
  return jsonp("https://api.deezer.com" + path);
}
function pickBest(list, track) {
  const want = norm(track.title).split(" ").sort((a, b) => b.length - a.length)[0];
  const art = norm(track.artist).split(" ").filter(w => w.length > 2);
  const withPrev = (list || []).filter(x => x.preview);
  return withPrev.find(x => norm(x.title).includes(want) && art.some(w => norm(x.artist.name).includes(w)))
      || withPrev.find(x => norm(x.title).includes(want))
      || null;
}
const PREVIEW_PENDING = new Map();
function getPreview(track) {
  const key = track.artist + "|" + track.title;
  if (PREVIEW_CACHE.has(key)) return Promise.resolve(PREVIEW_CACHE.get(key));
  if (!PREVIEW_PENDING.has(key)) PREVIEW_PENDING.set(key, findPreview(track, key).finally(() => PREVIEW_PENDING.delete(key)));
  return PREVIEW_PENDING.get(key);
}
async function findPreview(track, key) {
  let hit = null;
  try {
    const a = await deezer("/search?limit=10&q=" + encodeURIComponent(track.q));
    hit = pickBest(a.data, track);
    if (!hit) {
      const b = await deezer("/search?limit=25&q=" + encodeURIComponent(track.title));
      hit = pickBest(b.data, track);
    }
  } catch (e) { hit = null; }
  const res = hit ? { url: hit.preview, cover: hit.album && hit.album.cover_medium, link: hit.link, album: hit.album && hit.album.title } : null;
  PREVIEW_CACHE.set(key, res);
  return res;
}

/* Images des questions : image principale de l'article Wikipédia, gardée seulement si elle vient de
   Wikimedia Commons (licences libres). On récupère auteur, licence et page source pour le crédit. */
const IMG_CACHE = new Map(), IMG_PENDING = new Map();
const stripHtml = h => { const d = document.createElement("div"); d.innerHTML = h || ""; return d.textContent.replace(/\s+/g, " ").trim(); };
function getImage(wiki) {
  if (IMG_CACHE.has(wiki)) return Promise.resolve(IMG_CACHE.get(wiki));
  if (IMG_PENDING.has(wiki)) return IMG_PENDING.get(wiki);
  const p = (async () => {
    try {
      const sum = await fetch("https://fr.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(wiki.replace(/ /g, "_"))).then(r => r.ok ? r.json() : null);
      const im = sum && (sum.originalimage || sum.thumbnail);
      if (!im || !im.source.split("?")[0].includes("/wikipedia/commons/")) return null;
      const clean = im.source.split("?")[0], parts = clean.split("/");
      const file = decodeURIComponent(clean.includes("/thumb/") ? parts[parts.length - 2] : parts[parts.length - 1]);
      const api = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=720&titles=" + encodeURIComponent("File:" + file);
      const j = await fetch(api).then(r => r.json());
      const page = Object.values(j.query.pages)[0], ii = page && page.imageinfo && page.imageinfo[0];
      if (!ii) return null;
      const md = ii.extmetadata || {};
      return { src: ii.thumburl || ii.url, page: ii.descriptionurl,
        article: sum.content_urls && sum.content_urls.desktop && sum.content_urls.desktop.page,
        author: stripHtml(md.Artist && md.Artist.value) || "auteur inconnu",
        license: (md.LicenseShortName && md.LicenseShortName.value) || "licence libre" };
    } catch (e) { return null; }
  })().then(v => { IMG_CACHE.set(wiki, v); IMG_PENDING.delete(wiki); return v; });
  IMG_PENDING.set(wiki, p);
  return p;
}
function prefetch(t, audio) {
  if (!t) return;
  if (t.kind === "quiz") { if (t.img) getImage(t.img.wiki); return; }
  const p = getPreview(t);
  if (audio) p.then(c => { if (c && S.screen !== "home") preloadClip(c.url); });
}

/* Deux lecteurs : pendant qu'un extrait joue, l'autre télécharge déjà le suivant.
   Au clic sur « Suivant », on bascule sur le lecteur prêt : la musique part sans attendre le réseau. */
const players = [new Audio(), new Audio()];
players.forEach(a => { a.preload = "auto"; a.dataset.url = ""; });
let player = players[0];
const spare = () => player === players[0] ? players[1] : players[0];
function preloadClip(url) {
  if (!url) return;
  const s = spare();
  if (s.dataset.url === url) return;
  if (!s.paused) s.pause();
  s.dataset.url = url; s.dataset.pre = "1"; s.src = url;
  try { s.load(); } catch (e) {}
}
function playClip(url) {
  clearInterval(fadeT);
  const s = spare();
  if (s.dataset.url === url) {
    if (!player.paused) player.pause();
    player = s;
  } else if (player.dataset.url !== url || player.ended) {
    player.dataset.url = url; player.src = url;
  }
  player.dataset.pre = "";
  try { player.currentTime = 0; } catch (e) {}
  player.volume = 1;
  return player.play();
}
let fadeT = 0;
function stopClip() {
  const el = player;
  if (el.paused) return;
  clearInterval(fadeT);
  fadeT = setInterval(() => {
    el.volume = Math.max(0, el.volume - 0.15);
    if (el.volume <= 0.01) { clearInterval(fadeT); el.pause(); }
  }, 40);
}

let actx = null, crackleSrc = null, crackleGain = null;
function startCrackle() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) { d[i] = (Math.random() * 2 - 1) * 0.015; if (Math.random() < 0.0007) d[i] = (Math.random() * 2 - 1) * 0.6; }
    crackleSrc = actx.createBufferSource(); crackleSrc.buffer = buf; crackleSrc.loop = true;
    const f = actx.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 800;
    crackleGain = actx.createGain(); crackleGain.gain.value = 0.45;
    crackleSrc.connect(f).connect(crackleGain).connect(actx.destination); crackleSrc.start();
  } catch (e) {}
}
function stopCrackle() {
  try { if (crackleGain) crackleGain.gain.setTargetAtTime(0, actx.currentTime, 0.08); const s = crackleSrc; setTimeout(() => { try { s && s.stop(); } catch (e) {} }, 400); } catch (e) {}
  crackleSrc = null;
}

const normTxt = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
  .replace(/&/g, " ").replace(/['’`´.]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }

}
function close(a, b) {

  return tol > 0 && Math.abs(a.length - b.length) <= tol && lev(a, b) <= tol;
}

let KNOWN = null;
function knownNames() {
  if (KNOWN) return KNOWN;

  const add = a => artistKeys(a).forEach(k => { k.forEach(x => KNOWN.add(x)); KNOWN.add(k.join("")); });

}

function hasSeq(inp, cand) {
  const jc = cand.join("");
  for (let i = 0; i + cand.length <= inp.length; i++) if (cand.every((c, k) => near(inp[i + k], c))) return true;
  for (let i = 0; i < inp.length; i++) { let acc = ""; for (let j = i; j < inp.length; j++) { acc += inp[j]; if (near(acc, jc)) return true; } }

const BAND_WORDS = new Set("orchestra orchestre quartet quintet quintette trio club band boys girls gang experience messengers five seeds stripes league aid social dark sus tesos papas mamas".split(" "));
const NOSPLIT = /^(Earth, Wind & Fire|The Mamas & the Papas|Booker T\. & the M\.G\.'s)$/;
const ARTIST_ALIASES = {
  "The Jimi Hendrix Experience": ["Hendrix", "Jimi Hendrix"], "Duke Ellington Orchestra": ["Ellington"], "The Dave Brubeck Quartet": ["Brubeck"],
  "Ramsey Lewis Trio": ["Ramsey Lewis"], "Quintette du Hot Club de France": ["Hot Club de France", "Reinhardt", "Grappelli"],
  "Orchestral Manoeuvres In The Dark": ["OMD"], "Booker T. & the M.G.'s": ["Booker T"], "Earth, Wind & Fire": ["EWF"],
  "Grandmaster Flash & The Furious Five": ["Grandmaster Flash"], "Fruko y sus Tesos": ["Fruko"]
};
const KEY_CACHE = new Map(), FILLER = new Set(["the", "and", "et"]);
function artistKeys(artist) {
  if (KEY_CACHE.has(artist)) return KEY_CACHE.get(artist);
  const strip = w => w[0] === "the" ? w.slice(1) : w;
  const out = [toks(artist), strip(toks(artist)), ...(ARTIST_ALIASES[artist] || []).map(toks)];
  const segs = NOSPLIT.test(artist) ? [artist] : artist.split(/\s*(?:&|,|\bfeat\.?|\bft\.)\s*/i).filter(x => x.trim());
  segs.forEach(seg => {
    const w = toks(seg), s = strip(w);
    if (!s.length) return;
    out.push(s);
    const band = w[0] === "the" || NOSPLIT.test(artist) || s.some(x => BAND_WORDS.has(x));
    if (band || s.length < 2) return;
    const raw = seg.trim().split(/\s+/);
    while (raw.length > 1 && /^(jr|sr|ii|iii)\.?$/i.test(raw[raw.length - 1])) raw.pop();
    const last = toks(raw[raw.length - 1]);
    if (last.join("").length >= 3) out.push(last);
  });
  const keys = out.map(k => k.filter(x => !FILLER.has(x))).filter(k => k.length);
  KEY_CACHE.set(artist, keys);
  return keys;
}

  $app.querySelector("#back").addEventListener("click", renderHome);

function startLevel(id) {
  S.level = S.theme.levels.find(l => l.id === id);
  S.order = (S.pre && S.pre[id]) || shuffle(S.level.tracks);
  if (S.pre) S.pre[id] = null;

/* Cycle d'une question : loading → playing ⇄ paused → answered.
   L'élément suivant est préchargé pendant la manche en cours : au clic sur « Suivant », l'extrait

function newQuestion() {
  const t = S.order[S.qi], quiz = t.kind === "quiz";
  S.choices = quiz
    ? shuffle([{ title: t.answer, ok: true }, ...t.decoys.map(d => ({ title: d, ok: false }))])

  prefetch(S.order[S.qi + 1], true);
  if (quiz) {
    if (!t.img) { beginTimer("", true); return; }
    const done = info => { if (token !== S.token || S.phase !== "loading") return; S.img = info; beginTimer("", true); };
    if (IMG_CACHE.has(t.img.wiki)) { done(IMG_CACHE.get(t.img.wiki)); return; }
    getImage(t.img.wiki).then(done);
    setTimeout(() => done(null), 7000);
    return;
  }
  const key = t.artist + "|" + t.title;
  if (PREVIEW_CACHE.has(key)) { S.clip = PREVIEW_CACHE.get(key); autoStart(token); return; }

/* Ordres de jeu tirés à l'avance, pour précharger le premier élément de chaque set. */
function prepareOrders(levels) {
  S.pre = S.pre || {};
  levels.forEach(l => { if (!l) return; const o = shuffle(l.tracks); S.pre[l.id] = o; prefetch(o[0]); });
}

async function autoStart(token) {
  if (S.phase !== "loading") return;
  if (document.hidden) { S.phase = "idle"; S.simMsg = "Extrait prêt : appuie sur Lancer."; renderGame(); return; }
  if (!S.clip) { startCrackle(); beginTimer("Extrait introuvable sur Deezer · simulé", true); return; }
  try {
    await playClip(S.clip.url);
    if (token !== S.token || S.phase !== "loading") { stopClip(); return; }
    beginTimer("Extrait Deezer · 30 secondes", false);
  } catch (e) {
    if (token !== S.token) return;

}

function beginTimer(msg, simulated) {

  say(who + (S.silent ? "Question affichée. Quatre réponses disponibles." : "Extrait lancé. Quatre réponses disponibles."));
  tick();
}

function onPlayButton() {
  if (S.phase === "idle") {
    if (S.clip) playClip(S.clip.url).then(() => beginTimer("Extrait Deezer · 30 secondes", false)).catch(() => { startCrackle(); beginTimer("Lecture impossible · extrait simulé", true); });
    else { startCrackle(); beginTimer("Extrait introuvable sur Deezer · simulé", true); }
  } else if (S.phase === "playing") pauseRound();
  else if (S.phase === "paused") resumeRound();

/* Après la réponse, l'extrait continue jusqu'au morceau suivant ; le bouton reste Pause / Reprendre / Réécouter. */
const canReplay = () => S.phase === "answered" && S.order[S.qi].kind !== "quiz" && !!S.clip && !S.simulated;

  const b = document.getElementById("play"), on = !player.paused, [lbl, ico] = deckLabel();
  if (b) { b.classList.toggle("is-pause", on); b.setAttribute("aria-label", lbl); b.innerHTML = `<span class="ico">${ico}</span>${lbl}`; }

players.forEach(a => ["play", "pause", "ended"].forEach(ev => a.addEventListener(ev, e => { if (e.target === player) syncDeck(); })));

/* ===================== Commande vocale =====================
   Bouton micro : maintenu = on parle tant qu'on appuie ; tapé = l'écoute s'arrête toute seule à la fin de la phrase.
   Pendant l'écoute, la musique baisse (ou se met en pause sur iPhone, où le volume n'est pas réglable). */

const MIC_ICO = `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="1" width="6" height="9" rx="3" fill="#e0b04f"/><path d="M3 7.5a5 5 0 0 0 10 0h-1.6a3.4 3.4 0 0 1-6.8 0zM7.2 12.4h1.6V15H7.2z" fill="#e0b04f"/></svg>`;

  if (!SR) return "";
  const lbl = V.on ? "J'écoute… relâche pour valider" : "Maintenir pour parler";
  return `<div class="voice">

      <p class="voice-msg" id="voice-msg" aria-live="polite">${V.msg || (S.phase === "answered" ? "Dis « suivant » pour continuer." : typing() ? "Dis le nom de l'artiste." : S.order[S.qi].kind === "quiz" ? "Dis le numéro ou la réponse." : "Dis le numéro, le titre ou l'artiste.")}</p>

function voiceUI() {

}

    else if (!on && V.resume) { V.resume = false; if (S.phase === "playing" || S.phase === "answered") { const p = player.play(); if (p) p.catch(() => {}); } }

  let finals = null;

    const res = e.results[e.results.length - 1];

    else { V.msg = `<q>${esc(res[0].transcript)}</q>`; voiceUI(); }
  };

    V.msg = e.error === "not-allowed" || e.error === "service-not-allowed" ? "Micro refusé : autorise-le dans les réglages du navigateur."

const NUM_WORDS = [["1", "un", "une", "premier", "premiere", "hein"], ["2", "deux", "deuxieme", "second", "seconde", "de"], ["3", "trois", "troisieme"], ["4", "quatre", "quatrieme", "cat", "catre"]];
const CMD = {
  next: ["suivant", "suivante", "la suivante", "chanson suivante", "morceau suivant", "question suivante", "next", "on continue", "continue", "resultat", "voir le resultat"],
  pass: ["je passe", "passe", "joker", "je sais pas", "je ne sais pas", "aucune idee"],
  pause: ["pause", "stop", "arrete"],
  play: ["reprendre", "reprends", "lecture", "play", "rejoue", "reecouter", "encore"]
};
function voiceNumber(alts) {
  for (const a of alts) {
    const t = toks(a).filter(x => !["le", "la", "reponse", "numero", "c", "est", "cest", "n"].includes(x));
    if (t.length === 1) { const i = NUM_WORDS.findIndex(w => w.includes(t[0])); if (i >= 0) return i; }
  }
  return -1;
}
function handleVoice(alts) {
  const said = alts[0];
  V.heard = said;
  const phrases = alts.map(a => toks(a).join(" "));
  const is = k => phrases.some(p => CMD[k].includes(p));
  const live = S.phase === "playing" || S.phase === "paused";
  V.msg = `Entendu : <q>${esc(said)}</q>`;
  if (S.phase === "answered") {
    if (is("next")) { const n = document.getElementById("next"); V.msg = ""; if (n) n.click(); return; }
    if (is("pause") && !player.paused) { player.pause(); voiceUI(); return; }
    if (is("play") && canReplay()) { onPlayButton(); voiceUI(); return; }
    V.msg += " · dis « suivant » pour continuer."; voiceUI(); return;
  }
  if (!live) { voiceUI(); return; }
  if (is("pass")) { V.msg = ""; answer(null, { pass: true }); return; }
  if (is("pause") && S.phase === "playing") { pauseRound(); voiceUI(); return; }
  if (is("play") && S.phase === "paused") { resumeRound(); voiceUI(); return; }

    return;
  }
  let i = voiceNumber(alts);
  if (i < 0) {
    for (const a of alts) {
      const m = S.choices.map((c, k) => (titleMatch(a, c.title) || (c.artist && artistMatch(a, c.artist))) ? k : -1).filter(k => k >= 0);
      if (m.length === 1) { i = m[0]; break; }
    }
  }
  if (i >= 0 && i < S.choices.length) { V.msg = ""; answer(i); return; }
  V.msg += " · pas reconnu, réessaie ou touche une réponse."; voiceUI();
}
function bindMic() {
  const b = document.getElementById("mic");
  if (!b) return;
  b.addEventListener("contextmenu", e => e.preventDefault());
  b.addEventListener("pointerdown", e => {
    if (b.disabled || e.button > 0) return;

function pauseRound() {

function resumeRound() {

const typing = () => S.mode === "saisie" && S.order[S.qi] && S.order[S.qi].kind !== "quiz";

    ${answered ? `
      <section class="feedback ${res.ok ? "ok" : "ko"}">
        <h3 tabindex="-1" id="fb-h">${S.players ? (res.ok ? `Bien joué, ${esc(S.players[res.player].name)} !` : res.pass ? `${esc(S.players[res.player].name)} passe` : res.timeout ? `Temps écoulé pour ${esc(S.players[res.player].name)}` : `Raté, ${esc(S.players[res.player].name)}`) : res.ok ? "Bien joué !" : res.pass ? "Passé" : res.timeout ? "Temps écoulé" : "Raté"}</h3>
        ${typeMode && res.typed ? `<p class="mode-line">Ta réponse : « ${esc(res.typed)} »</p>` : ""}
        ${quiz ? `<p class="answer">${t.answer}</p>` : `
        <div class="reveal">
          ${S.clip && S.clip.cover ? `<img src="${S.clip.cover}" alt="Pochette de l'album ${S.clip.album || ""}" width="72" height="72">` : ""}
          <div class="reveal-t">
            <p class="answer">${t.title} <span>· ${t.artist}${t.year ? ` · ${th.yearLabel} ${t.year}` : ""}</span></p>
            ${S.clip && S.clip.link ? `<a class="dz" href="${S.clip.link}" target="_blank" rel="noopener">Écouter en entier sur Deezer ↗</a>` : ""}
          </div>
        </div>`}
        ${t.rank ? `<p class="rank"><span class="mono">N°${t.rank}</span> des ventes depuis 1969 · ${l.groupTitle}</p>` : ""}
        <p class="fact">${t.fact}</p>
        ${t.film || t.context ? `<dl class="notes">
          ${t.film ? `<div><dt>À l'écran</dt><dd>${t.film}</dd></div>` : ""}
          ${t.context ? `<div><dt>Contexte</dt><dd>${t.context}</dd></div>` : ""}
        </dl>` : ""}
        <p class="pts mono">${res.ok ? `+${res.points} pts (dont ${res.points - BASE_POINTS} de bonus vitesse)` : "+0 pt"}</p>
        <div class="fb-actions">${voiceBar()}<button class="next" id="next">${nextLabel}</button></div>
      </section>` : ""}`;

  $app.querySelector("#back").addEventListener("click", () => { stopRound(); S.token++; S.phase = "idle"; renderTheme(th); });
  const play = $app.querySelector("#play"); if (play) play.addEventListener("click", onPlayButton);
  $app.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
  bindMic();
  const tf = $app.querySelector("#type-form");
  if (tf) {
    const inp = tf.querySelector("#type-in");
    inp.addEventListener("input", () => { S.typed = inp.value; });
    tf.addEventListener("submit", e => { e.preventDefault(); submitTyped(inp.value); });
    const gu = tf.querySelector("#give-up"); if (gu) gu.addEventListener("click", () => answer(null, { pass: true }));
    if (typeFocused && !inp.disabled) { inp.focus({ preventScroll: true }); const n = inp.value.length; try { inp.setSelectionRange(n, n); } catch (e) {} }
  }
  const next = $app.querySelector("#next");
  if (next) next.addEventListener("click", () => { clearInterval(fadeT); if (!player.paused) player.pause(); unlockAudio(); goNext(); });
}

function submitTyped(v) {
  if (S.phase !== "playing" && S.phase !== "paused") return;
  S.typed = v;
  if (!v.trim()) { document.getElementById("type-in").focus(); return; }
  const t = S.order[S.qi];
  if (artistMatch(v, t.artist)) { answer(null, { typed: v, ok: true }); return; }
  S.tries++;
  S.typeMsg = titleMatch(v, t.title) ? "Bon titre ! Mais il faut le nom de l'artiste." : "Pas ça. Essaie encore.";
  const msg = document.getElementById("type-msg"), row = document.querySelector(".type-row"), inp = document.getElementById("type-in");
  if (msg) { msg.textContent = S.typeMsg; msg.classList.add("ko"); }
  if (row) { row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake"); }
  if (inp) { inp.focus(); inp.select(); }
  say(S.typeMsg);
}
function answer(i, o = {}) {
  if (S.phase !== "playing" && S.phase !== "paused") return;
  const left = leftNow();
  cancelAnimationFrame(S.raf); stopCrackle();
  if (i === null && !o.typed && typing() && S.typed && S.typed.trim()) o.typed = S.typed.trim();
  const ok = "ok" in o ? o.ok : i !== null && S.choices[i].ok;
  const points = ok ? BASE_POINTS + Math.round(left) * BONUS_PER_SEC : 0;
  S.score += points; S.picked = i; S.phase = "answered";
  const player = turnOf(S.qi);
  if (S.players) { S.players[player].score += points; if (ok) S.players[player].correct++; }
  S.results.push({ ok, points, timeout: i === null && !o.pass && !("ok" in o), pass: !!o.pass, typed: o.typed || "", player });
  renderGame();
  const t = S.order[S.qi];
  say(`${ok ? "Bonne réponse" : "Mauvaise réponse"}. C'était ${t.title}, de ${t.artist}.`);
  const fb = document.querySelector(".feedback"), nx = document.getElementById("next");
  const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (nx) nx.focus({ preventScroll: true });
  if (fb) requestAnimationFrame(() => fb.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "end" }));
}
function goNext() {
  if (S.qi + 1 < S.order.length) { S.qi++; newQuestion(); }
  else renderResult();
}

function renderResult() {
  if (S.players) return renderDuoResult();
  S.screen = "result";
  const th = S.theme, l = S.level, total = S.order.length, correct = S.results.filter(r => r.ok).length, stars = starsFor(correct, total);
  const k = bkey(th, l), prev = best[k];
  const isRecord = !prev || S.score > prev.points;
  if (isRecord) { best[k] = { points: S.score, correct, total }; saveBest(best); }
  const vi = correct === total ? 5 : Math.min(4, Math.floor(correct / total * 5));
  const verdict = ["Le DJ a fait une pause.", "Encore quelques disques (et quelques livres) à découvrir.", "Pas mal du tout.", "Belle oreille.", "Presque parfait.", "Un sans-faute. Le club t'offre un verre."][vi];
  const order = playOrder(th), nextLevel = order[order.indexOf(l) + 1];
  prepareOrders([l, nextLevel]);
  if (S.pre[l.id]) prefetch(S.pre[l.id][0], true);
  $app.innerHTML = `
    <div class="topbar"><button class="back" id="back">← ${th.name}</button><span class="eyebrow">Fin du ${l.tier ? `niveau ${l.tier}` : `set ${pad2(l.id)}`}</span></div>
    <section class="result-card" style="--lvl:${l.color}">
      <div class="stack" style="gap:8px">
        <span class="eyebrow">${th.name} · ${l.name}</span>
        <div class="big mono" style="font-family:var(--f-display)">${S.score}<span style="font-size:.4em;color:var(--smoke)"> pts</span></div>
        <div>${starStr(stars)}</div>
        <p class="verdict" tabindex="-1" id="verdict">${correct} sur ${total} trouvés. ${verdict}</p>
        ${isRecord ? `<span class="chip" style="align-self:flex-start">Nouveau record</span>` : `<span class="best">Record : ${prev.points} pts</span>`}
      </div>
      <div class="art">${ART[l.instrument](l.color)}</div>
    </section>
    <section class="stack" style="gap:10px">
      <h2 style="font-size:24px">La setlist</h2>
      <ol class="recap">
        ${S.order.map((t, i) => { const r = S.results[i]; return `<li>
          <span class="mark ${r.ok ? "ok" : "ko"}" aria-label="${r.ok ? "Trouvé" : "Raté"}">${r.ok ? "✓" : "✕"}</span>
          <span class="t">${itemLine(t)}</span>
          <span class="p mono">${r.points}</span></li>`; }).join("")}
      </ol>
    </section>
    <div class="actions">
      <button class="btn primary" id="again">Rejouer ce set</button>
      ${nextLevel ? `<button class="btn" id="nextlvl">Set suivant : ${nextLevel.name}</button>` : ""}
    </div>`;
  $app.querySelector("#back").addEventListener("click", () => renderTheme(th));
  $app.querySelector("#again").addEventListener("click", () => { unlockAudio(); startLevel(l.id); });
  const nl = $app.querySelector("#nextlvl"); nl && nl.addEventListener("click", () => { unlockAudio(); startLevel(nextLevel.id); });
  window.scrollTo({ top: 0 });
  document.getElementById("verdict").focus();
}

function renderDuoResult() {
  S.screen = "result";
  const th = S.theme, l = S.level, P = S.players;
  const per = P.map((_, i) => S.results.filter(r => r.player === i).length);
  const ranked = P.map((p, i) => ({ ...p, i })).sort((a, b) => b.score - a.score);
  const tie = ranked[0].score === ranked[1].score;
  const head = tie ? "Égalité !" : `${esc(ranked[0].name)} gagne !`;
  const sub = tie ? `${ranked[0].score} points chacun. Il va falloir une revanche.` : `${ranked[0].score} points contre ${ranked[1].score}.`;
  const order = playOrder(th), nextLevel = order[order.indexOf(l) + 1];
  prepareOrders([l, nextLevel]);
  if (S.pre[l.id]) prefetch(S.pre[l.id][0], true);
  $app.innerHTML = `
    <div class="topbar"><button class="back" id="back">← ${th.name}</button><span class="eyebrow">Duo · fin du ${l.tier ? `niveau ${l.tier}` : `set ${pad2(l.id)}`}</span></div>
    <section class="result-card" style="--lvl:${l.color}">
      <div class="stack" style="gap:8px">
        <span class="eyebrow">${th.name} · ${l.name}</span>
        <div class="big" style="font-family:var(--f-display)" tabindex="-1" id="verdict">${head}</div>
        <p class="verdict">${sub}</p>
        <ol class="podium">${ranked.map((p, k) => `<li class="${!tie && k === 0 ? "win" : ""}">
          <span class="nm">${esc(p.name)}</span><span class="mono">${p.correct} / ${per[p.i]} trouvés</span><span class="mono pts">${p.score} pts</span></li>`).join("")}</ol>
      </div>
      <div class="art">${ART[l.instrument](l.color)}</div>
    </section>
    <section class="stack" style="gap:10px">
      <h2 style="font-size:24px">La setlist</h2>
      <ol class="recap duo">
        ${S.order.map((t, i) => { const r = S.results[i]; return `<li>
          <span class="mark ${r.ok ? "ok" : "ko"}" aria-label="${r.ok ? "Trouvé" : "Raté"}">${r.ok ? "✓" : "✕"}</span>
          <span class="t">${itemLine(t)}<span class="who" style="color:${PCOLORS[r.player]}">${esc(P[r.player].name)}</span></span>
          <span class="p mono">${r.points}</span></li>`; }).join("")}
      </ol>
    </section>
    <div class="actions">
      <button class="btn primary" id="again">Revanche sur ce set</button>
      ${nextLevel ? `<button class="btn" id="nextlvl">Set suivant : ${nextLevel.name}</button>` : ""}
    </div>
    <p class="best">En Duo, les scores ne comptent pas dans tes records solo.</p>`;
  $app.querySelector("#back").addEventListener("click", () => renderTheme(th));
  $app.querySelector("#again").addEventListener("click", () => { unlockAudio(); startLevel(l.id); });
  const nl = $app.querySelector("#nextlvl"); nl && nl.addEventListener("click", () => { unlockAudio(); startLevel(nextLevel.id); });
  window.scrollTo({ top: 0 });
  document.getElementById("verdict").focus();
}

/* Téléphone verrouillé, onglet changé ou page fermée : on coupe le son et on met le chrono en pause. */
function pauseForBackground() {
  micStop();
  if (S.phase === "playing") pauseRound();
  else { stopCrackle(); if (!player.paused) player.pause(); }
}
document.addEventListener("visibilitychange", () => { if (document.hidden) pauseForBackground(); });
window.addEventListener("pagehide", pauseForBackground);
window.addEventListener("blur", () => { if (document.hidden) pauseForBackground(); });

document.addEventListener("keydown", e => {
  if (S.screen !== "game" || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if ((e.key === "p" || e.key === "P") && (S.phase === "playing" || S.phase === "paused" || canReplay())) { e.preventDefault(); onPlayButton(); return; }
  if (S.phase !== "playing" && S.phase !== "paused") return;
  const n = parseInt(e.key, 10);
  if (typing()) return;
  if (n >= 1 && n <= 4) { e.preventDefault(); answer(n - 1); }
});

renderHome();
</script>
</body>
</html>
