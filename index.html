<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15131e">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Blind Test">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Blind Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : une colonne façon « carte de club » centrée, enseigne lumineuse en tête, sets empilés comme un programme de soirée. Thème unique : club de nuit. */
:root {
  --night: #15131e;
  --velvet: #221c30;
  --curtain: #5e1a26;
  --brass: #e0b04f;
  --brass-deep: #9c7228;
  --cream: #f3e6c8;
  --smoke: #a8a0ba;
  --line: #3a3150;
  --ok: #73c98f;
  --ko: #ee6b73;
  --f-display: "Abril Fatface", "Playfair Display", Georgia, serif;
  --f-body: "Karla", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background:
    radial-gradient(ellipse 70% 40% at 50% -5%, rgba(224,176,79,.16), transparent 70%),
    radial-gradient(ellipse 60% 50% at 100% 100%, rgba(94,26,38,.45), transparent 70%),
    var(--night);
  background-attachment: fixed;
  color: var(--cream);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
.app {
  max-width: 680px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 28px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--smoke); font-weight: 700; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
p { margin: 0; }

/* ——— Enseigne ——— */
.marquee {
  position: relative;
  border: 2px solid var(--brass);
  border-radius: 20px;
  padding: 26px 22px 22px;
  background: linear-gradient(180deg, rgba(94,26,38,.55), rgba(34,28,48,.9));
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
  overflow: hidden;
}
.bulbs { position: absolute; inset: 7px; pointer-events: none; border-radius: 14px;
  background-image: radial-gradient(circle, var(--brass) 2px, transparent 2.6px);
  background-size: 18px 18px; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude;
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  padding: 5px; opacity: .55; animation: twinkle 2.4s steps(2) infinite; }
@keyframes twinkle { 50% { opacity: .9; } }
.marquee h1 { font-size: clamp(40px, 11vw, 64px); line-height: .95; color: var(--cream); }
.marquee h1 em { font-style: normal; color: var(--brass); display: block; }
.marquee .tag { margin-top: 10px; color: var(--smoke); max-width: 30ch; }
.hero-vinyl { width: clamp(96px, 26vw, 150px); }
.hero-vinyl svg { width: 100%; height: auto; display: block; animation: spin 6s linear infinite; }

/* ——— Liste des sets ——— */
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 28px; }
.sets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.set {
  width: 100%; text-align: left;
  display: grid; grid-template-columns: 72px 1fr auto; gap: 14px; align-items: center;
  background: var(--velvet); border: 1px solid var(--line); border-radius: 16px;
  padding: 12px 16px 12px 12px;
  transition: transform .15s ease, border-color .15s ease;
}
.set:hover { transform: translateY(-2px); border-color: var(--lvl); }
.set .art { width: 72px; height: 72px; }
.set .art svg { width: 100%; height: 100%; display: block; }
.set .txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.set .num { font-family: var(--f-mono); font-size: 12px; color: var(--lvl); letter-spacing: .08em; }
.set h3 { font-size: 21px; line-height: 1.15; }
.set .blurb { color: var(--smoke); font-size: 14px; }
.set .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.diff { display: flex; gap: 3px; }
.diff i { width: 7px; height: 14px; border-radius: 2px; background: var(--line); }
.diff i.on { background: var(--lvl); }
.best { font-size: 12px; color: var(--smoke); white-space: nowrap; }
.stars { color: var(--brass); letter-spacing: 2px; font-size: 14px; }
.stars .off { color: var(--line); }

.foot-note { font-size: 13px; color: var(--smoke); display: flex; gap: 10px; align-items: flex-start;
  border-top: 1px dashed var(--line); padding-top: 16px; }
.foot-note .chip { flex: none; }
.update-bar { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 18px; border-radius: 999px; max-width: calc(100% - 24px);
  background: var(--cream); color: var(--night); font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.update-bar button { border: none; border-radius: 999px; padding: 9px 16px; background: var(--night); color: var(--cream); font-weight: 700; }
.app-version { font-size: 12px; color: var(--smoke); text-align: center; margin: 0; }
.chip { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  border: 1px solid var(--brass-deep); color: var(--brass); padding: 3px 8px; border-radius: 999px; }

/* ——— Partie ——— */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--smoke); }
.back:hover { color: var(--cream); border-color: var(--smoke); }
.scorebox { text-align: right; }
.scorebox .val { font-size: 22px; color: var(--brass); }
.level-title { display: flex; flex-direction: column; gap: 4px; }
.level-title h2 { font-size: clamp(28px, 7vw, 38px); }
.dots { display: flex; gap: 6px; margin-top: 6px; }
.dots span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.dots span.ok { background: var(--ok); }
.dots span.ko { background: var(--ko); }
.dots span.cur { background: var(--lvl); }

.stage {
  position: relative; border-radius: 22px; padding: 20px;
  background: linear-gradient(160deg, #2b2340, #1a1626);
  border: 1px solid var(--line);
  display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center;
}
.deck { position: relative; width: clamp(130px, 36vw, 180px); aspect-ratio: 1; max-width: 100%; }
.deck .disc { width: 100%; height: 100%; display: block; }
.deck .disc.spinning { animation: spin 1.8s linear infinite; }
.deck .arm { position: absolute; width: 46%; right: -10%; top: -6%; transform-origin: 78% 12%;
  transform: rotate(-26deg); transition: transform .6s cubic-bezier(.3,1.4,.5,1); }
.deck .arm.down { transform: rotate(0deg); }
@keyframes spin { to { transform: rotate(360deg); } }
.controls { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.play {
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--brass); color: #231a08; border: none; border-radius: 999px;
  padding: 12px 22px 12px 14px; font-weight: 700; font-size: 17px;
  box-shadow: 0 6px 0 var(--brass-deep);
  transition: transform .1s ease, box-shadow .1s ease;
}
.play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--brass-deep); }
.play .ico { width: 30px; height: 30px; border-radius: 50%; background: #231a08; display: grid; place-items: center; }
.play .ico svg { width: 12px; height: 12px; }
.play[disabled] { opacity: .45; cursor: default; box-shadow: none; transform: none; }
.timer { display: flex; flex-direction: column; gap: 6px; }
.timer .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--smoke); }
.timer .clock { color: var(--cream); font-size: 15px; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--lvl); transform-origin: left; }
.sim { font-size: 12px; color: var(--smoke); }

.choices { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice {
  width: 100%; height: 100%; text-align: left;
  display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start;
  background: var(--velvet); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  transition: border-color .15s ease, background .15s ease, transform .1s ease;
}
.choice:not([disabled]):hover { border-color: var(--lvl); transform: translateY(-1px); }
.choice .k { font-family: var(--f-mono); font-size: 13px; width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center; border: 1px solid var(--line); color: var(--smoke); }
.choice .t { min-width: 0; display: flex; flex-direction: column; }
.choice .title { font-weight: 700; font-size: 16px; line-height: 1.25; }
.choice .artist { color: var(--smoke); font-size: 14px; }
.choice[disabled] { cursor: default; }
.choices.locked .choice { opacity: .45; filter: blur(.6px); }
.choice.is-ok { border-color: var(--ok); background: rgba(115,201,143,.12); opacity: 1 !important; filter: none !important; }
.choice.is-ok .k { background: var(--ok); color: #10251a; border-color: var(--ok); }
.choice.is-ko { border-color: var(--ko); background: rgba(238,107,115,.12); opacity: 1 !important; filter: none !important; }
.choice.is-ko .k { background: var(--ko); color: #2c0d10; border-color: var(--ko); }
.hint { text-align: center; color: var(--smoke); font-size: 14px; }

.feedback { scroll-margin-bottom: 16px;

  border-radius: 18px; padding: 18px 20px; border: 1px solid var(--line);
  background: var(--velvet); display: flex; flex-direction: column; gap: 10px;
}
.feedback.ok { border-color: var(--ok); }
.feedback.ko { border-color: var(--ko); }
.feedback h3 { font-size: 26px; }
.feedback.ok h3 { color: var(--ok); }
.feedback.ko h3 { color: var(--ko); }
.feedback .answer { font-weight: 700; }
.feedback .answer span { color: var(--smoke); font-weight: 400; }
.feedback .fact { color: var(--smoke); font-size: 15px; }
.reveal { display: flex; gap: 14px; align-items: center; }
.reveal img { width: 72px; height: 72px; border-radius: 8px; flex: none; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.reveal-t { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.dz { color: var(--brass); font-size: 14px; }
.notes { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.notes div { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: baseline; padding-top: 8px; border-top: 1px dashed var(--line); }
.notes dt { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--lvl); }
.notes dd { margin: 0; font-size: 15px; color: var(--cream); line-height: 1.45; min-width: 0; }
@media (max-width: 420px) { .notes div { grid-template-columns: 1fr; gap: 2px; } }
.feedback .pts { font-size: 14px; color: var(--brass); }
.next { align-self: flex-end; background: var(--cream); color: var(--night); border: none; border-radius: 999px;
  padding: 10px 20px; font-weight: 700; }

/* ——— Résultat ——— */
.result-card { border: 2px solid var(--lvl); border-radius: 22px; padding: 24px 22px;
  background: linear-gradient(180deg, rgba(94,26,38,.4), var(--velvet));
  display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.result-card .big { font-family: var(--f-display); font-size: clamp(48px, 14vw, 72px); line-height: 1; color: var(--brass); }
.result-card .verdict { font-size: 18px; }
.result-card .stars { font-size: 26px; }
.result-card .art { width: clamp(90px, 24vw, 120px); }
.result-card .art svg { width: 100%; height: auto; display: block; }
.recap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.recap li { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.recap .mark { font-weight: 700; }
.recap .mark.ok { color: var(--ok); }
.recap .mark.ko { color: var(--ko); }
.recap .t { min-width: 0; }
.recap .t span { color: var(--smoke); }
.recap .p { font-size: 14px; color: var(--brass); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border-radius: 999px; padding: 11px 20px; font-weight: 700; border: 1px solid var(--line); background: var(--velvet); }
.btn.primary { background: var(--brass); color: #231a08; border-color: var(--brass); }

@media (max-width: 560px) {
  .choices { grid-template-columns: 1fr; }
  .stage { grid-template-columns: 1fr; justify-items: center; }
  .controls { width: 100%; }
  .play { align-self: center; }
  .set { grid-template-columns: 56px 1fr; }
  .set .art { width: 56px; height: 56px; }
  .set .meta { grid-column: 2; flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px; }
  .result-card { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ——— Salles & thèmes ——— */
.stack { display: flex; flex-direction: column; gap: 14px; }
.marquee h1 em { display: inline; }
.rooms { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.room { width: 100%; height: 100%; text-align: left; display: flex; flex-direction: column; gap: 14px;
  background: var(--velvet); border: 1px solid var(--line); border-radius: 20px; padding: 18px;
  transition: transform .15s ease, border-color .15s ease; }
.room:hover { transform: translateY(-3px); border-color: var(--lvl); }
.room-art { width: 88px; height: 88px; flex: none; }
.room-art svg { width: 100%; height: 100%; display: block; }
.room-txt { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.room .num { font-family: var(--f-mono); font-size: 12px; color: var(--lvl); letter-spacing: .08em; text-transform: uppercase; }
.room h3 { font-size: 30px; line-height: 1.05; }
.room .blurb { color: var(--smoke); font-size: 14px; }
.room-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.room-head { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; border-bottom: 1px dashed var(--line); padding-bottom: 20px; }
.room-title { font-size: clamp(40px, 11vw, 60px); line-height: .95; color: var(--lvl); margin-top: 4px; }
.room-head .tag { margin-top: 10px; color: var(--smoke); max-width: 40ch; }
.room-art.lg { width: clamp(90px, 24vw, 130px); height: auto; }
.decade { font-size: 12px; color: var(--lvl); white-space: nowrap; }
.decade-group { border-top: 1px dashed var(--line); padding-top: 20px; }
.room-head + .decade-group { border-top: 0; padding-top: 0; }
.decade-head { align-items: flex-start; }
.back { white-space: nowrap; flex: none; }
.topbar .eyebrow { text-align: right; min-width: 0; }
.decade-head { display: flex; gap: 14px; align-items: center; }
.decade-head h2 { font-size: 28px; color: var(--lvl); }
.decade-head .blurb { color: var(--smoke); font-size: 14px; margin-top: 2px; }
.decade-art { width: 60px; height: 60px; flex: none; }
.decade-art svg { width: 100%; height: 100%; display: block; }
.sets.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.set.tier { grid-template-columns: 1fr; height: 100%; align-content: space-between; padding: 14px; }
.set.tier h3 { font-size: 22px; }
.set.tier .meta { align-items: flex-start; }
@media (max-width: 560px) {
  .sets.tiers { grid-template-columns: 1fr; }
  .set.tier { grid-template-columns: 1fr auto; align-items: center; }
  .set.tier .meta { grid-column: auto; flex-direction: column; align-items: flex-end; }
}
.play.is-pause { background: var(--cream); }
.install { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 16px; background: var(--velvet); border: 1px solid var(--line); }
.install-ico { width: 56px; height: 56px; } .install-ico svg { width: 100%; height: 100%; display: block; }
.install-t { min-width: 0; } .install h2 { font-size: 20px; } .install p { color: var(--smoke); font-size: 14px; }
@media (max-width: 480px) { .install { grid-template-columns: 48px 1fr; } .install .btn { grid-column: 1 / -1; } }
.src { font-size: 12px; color: var(--smoke); margin-top: 2px; } .src a { color: var(--lvl); }
.rank { align-self: flex-start; font-size: 13px; font-weight: 700; color: #15131e; background: var(--lvl); border-radius: 999px; padding: 4px 12px; }
.demo-note { border: 1px solid var(--brass-deep); border-radius: 14px; padding: 12px 14px; font-size: 14px; color: var(--cream); background: var(--velvet); }
.demo-note a { color: var(--brass); overflow-wrap: anywhere; }
/* ——— Duo ——— */
.modes { display: flex; flex-direction: column; gap: 10px; }
.seg { display: inline-flex; align-self: flex-start; padding: 4px; gap: 4px; border-radius: 999px; background: var(--velvet); border: 1px solid var(--line); }
.seg-b { border: none; background: none; border-radius: 999px; padding: 8px 22px; font-weight: 700; color: var(--smoke); }
.seg-b.on { background: var(--brass); color: #231a08; }
.mode-line { color: var(--smoke); font-size: 14px; }
.mode-line strong { color: var(--cream); }
.linkish { background: none; border: none; padding: 0; color: var(--brass); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.duo-form { display: flex; flex-direction: column; gap: 16px; max-width: 420px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.answer-mode { display: flex; flex-direction: column; gap: 8px; }
/* Multijoueur */
.field select { font: inherit; color: var(--cream); background: var(--velvet); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.avatars { border: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.avatars legend { font-weight: 700; margin-bottom: 8px; padding: 0; }
.av-opt { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px; border-radius: 16px;
  border: 1px solid var(--line); background: var(--velvet); cursor: pointer; text-align: center; font-size: 13px; }
.av-opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.av-opt .av-pic { width: 56px; height: 56px; display: block; }
.av-opt:has(input:checked) { border-color: var(--ac); box-shadow: 0 0 0 2px var(--ac); }
.av-opt:has(input:focus-visible) { outline: 3px solid var(--cream); outline-offset: 2px; }
.av { width: 34px; height: 34px; flex: none; display: inline-block; }
.av svg { width: 100%; height: 100%; display: block; }
.mp-link { display: flex; flex-direction: column; gap: 6px; }
.mp-link-row { display: flex; gap: 8px; }
.mp-link-row input { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--cream); background: var(--velvet); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.icon-btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 9px 14px; font-weight: 700;
  border: 1px solid var(--line); background: var(--velvet); color: var(--cream); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[aria-pressed="true"] { border-color: var(--ko); color: var(--ko); }
.mp-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mp-pl { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: var(--velvet); border: 1px solid var(--line); }
.mp-pl.me { border-color: var(--lvl); }
.mp-pl .nm { font-weight: 700; flex: 1; }
.tag-host { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--brass); color: #231a08; }
.mp-board { display: flex; flex-wrap: wrap; gap: 8px; }
.mp-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--velvet); border: 1px solid var(--line); font-size: 14px; }
.mp-chip .av { width: 26px; height: 26px; }
.mp-chip.me { border-color: var(--lvl); }
.mp-chip .val { font-weight: 700; }

/* ===================== API Deezer =====================
   1. Sur Netlify : /api/deezer/* est redirigé vers api.deezer.com (voir netlify.toml), donc fetch classique.
   2. Ailleurs (fichier ouvert en local) : repli en JSONP, que Deezer accepte avec output=jsonp.
   Les liens d'extraits expirent : on les cherche au moment de jouer, jamais stockés. */
const PREVIEW_CACHE = new Map();
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

function jsonp(url, ms = 6000) {
  return new Promise((resolve, reject) => {
    const cb = "dz_cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const done = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); reject(new Error("timeout")); }, ms);
    window[cb] = data => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error("jsonp")); };
    s.src = url + (url.includes("?") ? "&" : "?") + "output=jsonp&callback=" + cb;
    document.head.appendChild(s);
  });
}
async function deezer(path) {
  if (/netlify\.app$/.test(location.hostname)) try {
    const r = await fetch("/api/deezer" + path, { headers: { Accept: "application/json" } });
    const type = r.headers.get("content-type") || "";
    if (r.ok && type.includes("json")) return await r.json();
  } catch (e) {}
  return jsonp("https://api.deezer.com" + path);
}
function pickBest(list, track) {
  const want = norm(track.title).split(" ").sort((a, b) => b.length - a.length)[0];
  const art = norm(track.artist).split(" ").filter(w => w.length > 2);
  const withPrev = (list || []).filter(x => x.preview);
  return withPrev.find(x => norm(x.title).includes(want) && art.some(w => norm(x.artist.name).includes(w)))
      || withPrev.find(x => norm(x.title).includes(want))
      || null;
}
const PREVIEW_PENDING = new Map();
function getPreview(track) {
  const key = track.artist + "|" + track.title;
  if (PREVIEW_CACHE.has(key)) return Promise.resolve(PREVIEW_CACHE.get(key));
  if (!PREVIEW_PENDING.has(key)) PREVIEW_PENDING.set(key, findPreview(track, key).finally(() => PREVIEW_PENDING.delete(key)));
  return PREVIEW_PENDING.get(key);
}
async function findPreview(track, key) {
  let hit = null;
  try {
    const a = await deezer("/search?limit=10&q=" + encodeURIComponent(track.q));
    hit = pickBest(a.data, track);
    if (!hit) {
      const b = await deezer("/search?limit=25&q=" + encodeURIComponent(track.title));
      hit = pickBest(b.data, track);
    }
  } catch (e) { hit = null; }
  const res = hit ? { url: hit.preview, cover: hit.album && hit.album.cover_medium, link: hit.link, album: hit.album && hit.album.title } : null;
  PREVIEW_CACHE.set(key, res);
  return res;
}

/* Images des questions : image principale de l'article Wikipédia, gardée seulement si elle vient de
   Wikimedia Commons (licences libres). On récupère auteur, licence et page source pour le crédit. */
const IMG_CACHE = new Map(), IMG_PENDING = new Map();
const stripHtml = h => { const d = document.createElement("div"); d.innerHTML = h || ""; return d.textContent.replace(/\s+/g, " ").trim(); };
function getImage(wiki) {
  if (IMG_CACHE.has(wiki)) return Promise.resolve(IMG_CACHE.get(wiki));
  if (IMG_PENDING.has(wiki)) return IMG_PENDING.get(wiki);
  const p = (async () => {
    try {
      const sum = await fetch("https://fr.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(wiki.replace(/ /g, "_"))).then(r => r.ok ? r.json() : null);
      const im = sum && (sum.originalimage || sum.thumbnail);
      if (!im || !im.source.split("?")[0].includes("/wikipedia/commons/")) return null;
      const clean = im.source.split("?")[0], parts = clean.split("/");
      const file = decodeURIComponent(clean.includes("/thumb/") ? parts[parts.length - 2] : parts[parts.length - 1]);
      const api = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=720&titles=" + encodeURIComponent("File:" + file);
      const j = await fetch(api).then(r => r.json());
      const page = Object.values(j.query.pages)[0], ii = page && page.imageinfo && page.imageinfo[0];
      if (!ii) return null;
      const md = ii.extmetadata || {};
      return { src: ii.thumburl || ii.url, page: ii.descriptionurl,
        article: sum.content_urls && sum.content_urls.desktop && sum.content_urls.desktop.page,
        author: stripHtml(md.Artist && md.Artist.value) || "auteur inconnu",
        license: (md.LicenseShortName && md.LicenseShortName.value) || "licence libre" };
    } catch (e) { return null; }
  })().then(v => { IMG_CACHE.set(wiki, v); IMG_PENDING.delete(wiki); return v; });
  IMG_PENDING.set(wiki, p);
  return p;
}
function prefetch(t, audio) {
  if (!t) return;
  if (t.kind === "quiz") { if (t.img) getImage(t.img.wiki); return; }
  const p = getPreview(t);
  if (audio) p.then(c => { if (c && S.screen !== "home") preloadClip(c.url); });
}

/* Deux lecteurs : pendant qu'un extrait joue, l'autre télécharge déjà le suivant.
   Au clic sur « Suivant », on bascule sur le lecteur prêt : la musique part sans attendre le réseau. */
const players = [new Audio(), new Audio()];
players.forEach(a => { a.preload = "auto"; a.dataset.url = ""; });
let player = players[0];
const spare = () => player === players[0] ? players[1] : players[0];
function preloadClip(url) {
  if (!url) return;
  const s = spare();
  if (s.dataset.url === url) return;
  if (!s.paused) s.pause();
  s.dataset.url = url; s.dataset.pre = "1"; s.src = url;
  try { s.load(); } catch (e) {}
}
function playClip(url) {
  clearInterval(fadeT);
  const s = spare();
  if (s.dataset.url === url) {
    if (!player.paused) player.pause();
    player = s;
  } else if (player.dataset.url !== url || player.ended) {
    player.dataset.url = url; player.src = url;
  }
  player.dataset.pre = "";
  try { player.currentTime = 0; } catch (e) {}
  player.volume = 1;
  return player.play();
}
let fadeT = 0;
function stopClip() {
  const el = player;
  if (el.paused) return;
  clearInterval(fadeT);
  fadeT = setInterval(() => {
    el.volume = Math.max(0, el.volume - 0.15);
    if (el.volume <= 0.01) { clearInterval(fadeT); el.pause(); }
  }, 40);
}

function startCrackle() {
  try {

const normTxt = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
  .replace(/&/g, " ").replace(/['’`´.]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }

}

  if (a === b) return true;

let KNOWN = null;

  THEMES.forEach(th => th.levels.forEach(l => l.tracks.forEach(t => { if (t.kind === "quiz") return; add(t.artist); (t.decoys || []).forEach(d => d[1] && add(d[1])); })));

const BAND_WORDS = new Set("orchestra orchestre quartet quintet quintette trio club band boys girls gang experience messengers five seeds stripes league aid social dark sus tesos papas mamas".split(" "));
const NOSPLIT = /^(Earth, Wind & Fire|The Mamas & the Papas|Booker T\. & the M\.G\.'s)$/;
const ARTIST_ALIASES = {
  "The Jimi Hendrix Experience": ["Hendrix", "Jimi Hendrix"], "Duke Ellington Orchestra": ["Ellington"], "The Dave Brubeck Quartet": ["Brubeck"],
  "Ramsey Lewis Trio": ["Ramsey Lewis"], "Quintette du Hot Club de France": ["Hot Club de France", "Reinhardt", "Grappelli"],
  "Orchestral Manoeuvres In The Dark": ["OMD"], "Booker T. & the M.G.'s": ["Booker T"], "Earth, Wind & Fire": ["EWF"],
  "Grandmaster Flash & The Furious Five": ["Grandmaster Flash"], "Fruko y sus Tesos": ["Fruko"]
};
const KEY_CACHE = new Map(), FILLER = new Set(["the", "and", "et"]);
function artistKeys(artist) {
  if (KEY_CACHE.has(artist)) return KEY_CACHE.get(artist);
  const strip = w => w[0] === "the" ? w.slice(1) : w;
  const out = [toks(artist), strip(toks(artist)), ...(ARTIST_ALIASES[artist] || []).map(toks)];
  const segs = NOSPLIT.test(artist) ? [artist] : artist.split(/\s*(?:&|,|\bfeat\.?|\bft\.)\s*/i).filter(x => x.trim());
  segs.forEach(seg => {
    const w = toks(seg), s = strip(w);
    if (!s.length) return;
    out.push(s);
    const band = w[0] === "the" || NOSPLIT.test(artist) || s.some(x => BAND_WORDS.has(x));
    if (band || s.length < 2) return;
    const raw = seg.trim().split(/\s+/);
    while (raw.length > 1 && /^(jr|sr|ii|iii)\.?$/i.test(raw[raw.length - 1])) raw.pop();
    const last = toks(raw[raw.length - 1]);
    if (last.join("").length >= 3) out.push(last);

}

const NUM_SMALL = { zero: 0, un: 1, une: 1, deux: 2, trois: 3, quatre: 4, cinq: 5, six: 6, sept: 7, huit: 8, neuf: 9, dix: 10, onze: 11, douze: 12, treize: 13, quatorze: 14, quinze: 15, seize: 16 };

function numbersIn(input) {
  const t = toks(input), out = [];
  let total = 0, cur = 0, any = false;
  const flush = () => { if (any) out.push(total + cur); total = 0; cur = 0; any = false; };
  for (const w of t) {
    if (/^\d+$/.test(w)) { flush(); out.push(+w); continue; }
    if (w in NUM_SMALL) { cur += NUM_SMALL[w]; any = true; }
    else if (w in NUM_TENS) { if (w.startsWith("vingt") && cur % 100 === 4) cur += 76; else cur += NUM_TENS[w]; any = true; }

const SB_URL = "https://wydafhopszhzhhcbfznj.supabase.co", SB_KEY = "sb_publishable_5eK9TMRcHDwBqf6LXRYokQ_gBeN9D8o";

/* ---------- Transport ---------- */
async function mpNet(code, info, on) {
  if (mpLocal()) return mpLocalNet(code, info, on);
  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  const sb = createClient(SB_URL, SB_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  const ch = sb.channel("blindtest-" + code, { config: { broadcast: { self: false }, presence: { key: info.id } } });
  ch.on("broadcast", { event: "m" }, ({ payload }) => on.msg(payload));
  ch.on("presence", { event: "sync" }, () => {
    const st = ch.presenceState(), out = {};
    for (const [k, arr] of Object.entries(st)) if (arr && arr.length) out[k] = arr[arr.length - 1];
    on.presence(out);
  });
  await new Promise((res, rej) => {
    const to = setTimeout(() => rej(new Error("délai dépassé")), 12000);
    ch.subscribe(async s => {
      if (s === "SUBSCRIBED") { clearTimeout(to); try { await ch.track(info); } catch (e) {} res(); }
      else if (s === "CHANNEL_ERROR" || s === "TIMED_OUT") { clearTimeout(to); rej(new Error(s)); }
    });
  });
  return {
    send: payload => ch.send({ type: "broadcast", event: "m", payload }),
    track: i => ch.track(i),
    leave: () => { try { ch.untrack(); sb.removeChannel(ch); } catch (e) {} }
  };
}
function mpLocalNet(code, info, on) {
  const bc = new BroadcastChannel("blindtest-" + code), seen = {};
  let me = info;
  const emit = () => { const now = Date.now(), out = { [me.id]: me }; for (const [k, v] of Object.entries(seen)) if (now - v.t < 5000) out[k] = v.info; on.presence(out); };
  bc.onmessage = e => {
    const m = e.data;
    if (m.kind === "hb") { const fresh = !seen[m.info.id]; seen[m.info.id] = { info: m.info, t: Date.now() }; if (fresh) { emit(); bc.postMessage({ kind: "hb", info: me }); } }
    else if (m.kind === "bye") { delete seen[m.id]; emit(); }
    else if (m.kind === "m") on.msg(m.payload);
  };
  const hb = setInterval(() => { bc.postMessage({ kind: "hb", info: me }); emit(); }, 1500);
  bc.postMessage({ kind: "hb", info: me }); setTimeout(emit, 30);
  return Promise.resolve({
    send: payload => bc.postMessage({ kind: "m", payload }),
    track: i => { me = i; bc.postMessage({ kind: "hb", info: me }); emit(); },
    leave: () => { clearInterval(hb); bc.postMessage({ kind: "bye", id: me.id }); bc.close(); }
  });
}

/* ---------- Présence ---------- */

    // un nouvel arrivant en cours de partie reçoit l'état

/* ---------- Messages ---------- */
function mpOnMsg(m) {
  if (!M || !m) return;
  if (m.to && m.to !== M.me.id) return;
  switch (m.type) {
    case "full": M.view = "msg"; M.err = "La partie est complète."; try { M.net.leave(); } catch (e) {} M.net = null; mpRender(); break;
    case "end": if (M.role === "guest") { M.view = "msg"; M.err = "L'hôte a terminé la partie."; mpStopAudio(); mpRender(); } break;
    case "mode": M.mode = m.mode; if (M.view === "lobby") mpRender(); break;

    case "q": mpOnQuestion(m.qi); break;

function mpResolve(g) {

/* ---------- Affichage ---------- */
function mpPlayerChip(p, extra = "") {
  return `<li class="mp-pl ${p.id === M.me.id ? "me" : ""}"><span class="av">${avSvg(p.av)}</span><span class="nm">${esc(p.name)}${p.id === M.me.id ? " (toi)" : ""}</span>${p.host ? `<span class="tag-host">Hôte</span>` : ""}${extra}</li>`;
}
function mpBoard() {
  const el = document.getElementById("mp-board"); if (!el || !M) return;
  el.innerHTML = mpBoardHtml();
}
function mpBoardHtml() {
  return mpPlayers().slice().sort((a, b) => (M.scores[b.id] || 0) - (M.scores[a.id] || 0))
    .map(p => `<span class="mp-chip ${p.id === M.me.id ? "me" : ""}"><span class="av">${avSvg(p.av)}</span><span class="nm">${esc(p.name)}</span><span class="val mono">${fmtPts(M.scores[p.id] || 0)}</span></span>`).join("");
}
function mpLinkRow() {
  return `<div class="mp-link">
      <label for="mp-url" class="eyebrow">Lien d'invitation</label>
      <div class="mp-link-row">
        <input id="mp-url" readonly value="${esc(mpLink(M.code))}">
        <button type="button" class="icon-btn" id="mp-copy" aria-label="Copier le lien">${COPY_ICO}<span>Copier</span></button>
      </div>
      <p class="mode-line" id="mp-copied" role="status"></p>
    </div>`;
}
function mpBindLink() {
  const b = document.getElementById("mp-copy"); if (!b) return;
  b.addEventListener("click", async () => {
    const url = mpLink(M.code), out = document.getElementById("mp-copied");
    try { await navigator.clipboard.writeText(url); out.textContent = "Lien copié. Envoie-le aux autres joueurs."; }
    catch (e) { const i = document.getElementById("mp-url"); i.focus(); i.select(); out.textContent = "Lien sélectionné : copie-le avec Ctrl + C."; }
  });
}
function mpRender() {
  if (!M) return;
  S.screen = M.view === "q" ? "mpgame" : "mp";
  $app.style.setProperty("--lvl", M.l ? M.l.color : "#45b7c4");
  const top = (label) => `<div class="topbar"><button class="back" id="mp-quit">← Quitter</button><span class="eyebrow">${label}</span></div>`;
  const bindQuit = () => { const q = document.getElementById("mp-quit"); if (q) q.addEventListener("click", () => mpLeave()); };
  if (M.view === "connecting") {
    $app.innerHTML = `${top("Multijoueur")}<p class="hint" role="status">Connexion à la partie ${esc(M.code)}…</p>`; bindQuit(); return;
  }
  if (M.view === "msg") {
    $app.innerHTML = `${top("Multijoueur")}<section class="feedback ko"><h3 tabindex="-1" id="fb-h">${esc(M.err)}</h3>
      <div class="actions"><button class="btn primary" id="mp-home">Retour à l'accueil</button></div></section>`;
    bindQuit(); document.getElementById("mp-home").addEventListener("click", () => mpLeave()); document.getElementById("fb-h").focus(); return;
  }
  const pl = mpPlayers(), isHost = M.role === "host";
  if (M.view === "lobby" || M.view === "pickwait") {
    $app.innerHTML = `${top(`Partie ${esc(M.code)}`)}
      <header class="room-head"><div><p class="eyebrow">Multijoueur</p><h1 class="room-title">Salle d'attente</h1>
        <p class="tag">${isHost ? "Envoie le lien aux autres joueurs. Quand tout le monde est là, choisis la salle." : M.view === "pickwait" ? "L'hôte choisit la prochaine salle…" : "Tu es dans la partie. L'hôte va bientôt lancer la musique."}</p></div>
        <div class="room-art lg">${ART.headphones("#45b7c4")}</div></header>
      ${mpLinkRow()}
      <section class="stack" aria-labelledby="pl-h">
        <div class="section-head"><h2 id="pl-h">Joueurs</h2><span class="eyebrow">${pl.length} / ${M.cap}</span></div>
        <ul class="mp-list">${pl.map(p => mpPlayerChip(p, M.scores[p.id] ? `<span class="val mono">${fmtPts(M.scores[p.id])} pt</span>` : "")).join("")}</ul>
      </section>
      ${isHost ? `<section class="answer-mode" aria-label="Mode de réponse">
        <div class="seg" role="group" aria-label="Mode de réponse">
          <button class="seg-b ${M.mode === "qcm" ? "on" : ""}" id="am-qcm" aria-pressed="${M.mode === "qcm"}">QCM</button>
          <button class="seg-b ${M.mode === "saisie" ? "on" : ""}" id="am-saisie" aria-pressed="${M.mode === "saisie"}">Saisie</button>
        </div>
        <p class="mode-line">${M.mode === "saisie" ? "Chacun tape l'artiste (le titre seul vaut un demi-point). Plusieurs essais permis." : "Quatre propositions, un seul essai par morceau."}</p>
      </section>
      <div class="actions"><button class="btn primary" id="mp-pick" ${pl.length < 2 ? "disabled" : ""}>Choisir la salle →</button></div>
      ${pl.length < 2 ? `<p class="mode-line">Il faut au moins deux joueurs.</p>` : ""}`
      : `<p class="mode-line">Mode de réponse : <strong>${M.mode === "saisie" ? "Saisie" : "QCM"}</strong>.</p>`}`;
    bindQuit(); mpBindLink();
    if (isHost) {
      [["#am-qcm", "qcm"], ["#am-saisie", "saisie"]].forEach(([sel, m]) => $app.querySelector(sel).addEventListener("click", () => { M.mode = m; mpSend("mode", { mode: m }); }));
      $app.querySelector("#mp-pick").addEventListener("click", () => { M.view = "pick"; M.pickTheme = null; mpRender(); });
    }
    return;
  }
  if (M.view === "pick") {
    const th = M.pickTheme;
    $app.innerHTML = `<div class="topbar"><button class="back" id="mp-back">← ${th ? "Salles" : "Salle d'attente"}</button><span class="eyebrow">Partie ${esc(M.code)}</span></div>
      <section class="stack" aria-labelledby="pick-h">
        <div class="section-head"><h2 id="pick-h">${th ? th.name : "Choisis la salle"}</h2><span class="eyebrow">${pl.length} joueurs</span></div>
        ${th ? groupsOf(th).map(g => `<h3 class="mp-group">${g.title}</h3><ul class="mp-sets">${g.levels.map(l => `<li><button class="btn mp-set" style="--lvl:${l.color}" data-level="${l.id}">${l.tier ? TIER_NAMES[l.tier] : l.name}</button></li>`).join("")}</ul>`).join("")
          : `<ul class="rooms">${THEMES.map(t => `<li><button class="room" style="--lvl:${t.color}" data-theme="${t.id}"><span class="room-art">${ART[t.hero](t.color)}</span><span class="room-txt"><span class="num">${t.eyebrow}</span><h3>${t.name}</h3></span></button></li>`).join("")}</ul>`}
      </section>`;
    document.getElementById("mp-back").addEventListener("click", () => { if (th) { M.pickTheme = null; } else M.view = "lobby"; mpRender(); });
    $app.querySelectorAll(".room").forEach(b => b.addEventListener("click", () => { M.pickTheme = THEMES.find(t => t.id === b.dataset.theme); mpRender(); window.scrollTo({ top: 0 }); }));
    $app.querySelectorAll(".mp-set").forEach(b => b.addEventListener("click", () => { unlockAudio(); mpHostStart(th, th.levels.find(l => l.id === +b.dataset.level)); }));
    return;
  }
  if (M.view === "starting") {
    $app.innerHTML = `${top(`${M.th.name} · Partie ${esc(M.code)}`)}
      <div class="level-title"><span class="eyebrow">${M.l.tier ? `Niveau ${M.l.tier}` : `Set ${pad2(M.l.id)}`} · ${M.order.length} manches</span><h2>${M.l.name}</h2></div>
      <p class="hint" role="status">Préparez-vous, la musique arrive…</p>
      <div class="mp-board" id="mp-board">${mpBoardHtml()}</div>`;
    bindQuit(); return;
  }
  if (M.view === "rank") {
    const ranked = pl.slice().sort((a, b) => (M.round[b.id] || 0) - (M.round[a.id] || 0) || (M.scores[b.id] || 0) - (M.scores[a.id] || 0));
    let prev = null, rank = 0;
    const rows = ranked.map((p, i) => { const v = M.round[p.id] || 0; if (v !== prev) { rank = i + 1; prev = v; } return { p, rank, v }; });
    const order = M.th ? playOrder(M.th) : [], nextL = order[order.indexOf(M.l) + 1];
    $app.innerHTML = `${top(`Partie ${esc(M.code)}`)}
      <header class="verdict-head"><p class="eyebrow">${M.th ? `${M.th.name} · ${M.l.name}` : "Manche terminée"}</p>
        <h1 tabindex="-1" id="verdict">${rows[0] && rows[0].v > 0 ? `${esc(rows[0].p.name)} gagne la manche !` : "Manche terminée"}</h1></header>
      <ol class="mp-rank">${rows.map(r => `<li class="${r.rank === 1 && r.v > 0 ? "first" : ""} ${r.p.id === M.me.id ? "me" : ""}">
        <span class="pos mono">${r.rank}</span><span class="av">${avSvg(r.p.av)}</span><span class="nm">${esc(r.p.name)}</span>
        <span class="val mono">${fmtPts(r.v)} pt${r.v > 1 ? "s" : ""}</span><span class="tot mono">Total ${fmtPts(M.scores[r.p.id] || 0)}</span></li>`).join("")}</ol>
      ${isHost ? `<div class="actions">
        ${nextL ? `<button class="btn primary" id="mp-nextset">Manche suivante : ${esc(nextL.name)} →</button>` : ""}
        <button class="btn ${nextL ? "" : "primary"}" id="mp-again">Rejouer ce set</button>
        <button class="btn" id="mp-room">Changer de salle</button></div>`
      : `<p class="hint" role="status">L'hôte va lancer la manche suivante…</p>`}`;
    bindQuit();
    if (isHost) {
      const nb = document.getElementById("mp-nextset"); if (nb) nb.addEventListener("click", () => { unlockAudio(); mpHostStart(M.th, nextL); });
      document.getElementById("mp-again").addEventListener("click", () => { unlockAudio(); mpHostStart(M.th, M.l); });
      document.getElementById("mp-room").addEventListener("click", () => { mpSend("lobby", { pick: true }); M.view = "pick"; M.pickTheme = null; mpRender(); });
    }
    document.getElementById("verdict").focus();
    return;
  }
  if (M.view === "q") return mpRenderQ();
}
function mpRenderQ() {
  const q = M.q, t = q.t, l = M.l, th = M.th, quiz = q.quiz, isHost = M.role === "host";
  const live = q.phase === "playing", rev = q.phase === "revealed" ? q.rev : null;
  const typeMode = M.mode === "saisie";
  const typeFocused = document.activeElement && document.activeElement.id === "type-in";
  const left = live ? Math.max(0, q.dur - (performance.now() - q.start) / 1000) : q.phase === "wait" ? q.dur : 0;
  const status = q.phase === "wait" ? "Préparez-vous…" : rev ? "" : q.sent ? "Réponse envoyée… on attend de savoir si tu es le premier."
    : q.locked ? "Raté pour ce morceau. Attends les autres." : q.phase === "timeup" ? "Temps écoulé…" : "";
  const timer = `<div class="timer"><div class="row"><span>Temps restant</span><span class="clock mono" id="clock">00:${pad2(Math.ceil(left))}</span></div>
      <div class="bar"><i id="bar" style="transform:scaleX(${left / q.dur})"></i></div></div>`;
  const muteBtn = `<button type="button" class="icon-btn" id="mp-mute" aria-pressed="${M.muted}" aria-label="${M.muted ? "Remettre le son" : "Couper le son"}">${SOUND_ICO(!M.muted)}<span>${M.muted ? "Son coupé" : "Son"}</span></button>`;
  const canAnswer = live && !q.sent && !q.locked;
  const res = rev ? { ok: rev.winner === M.me.id } : null;
  $app.innerHTML = `
    <div class="topbar"><button class="back" id="mp-quit">← Quitter</button>${muteBtn}</div>
    <div class="mp-board" id="mp-board" aria-label="Scores">${mpBoardHtml()}</div>
    <div class="level-title">
      <span class="eyebrow">${th.name} · ${quiz ? "Question" : "Morceau"} ${q.qi + 1} sur ${M.order.length}</span>
      <h2>${l.name}</h2>
    </div>
    ${quiz ? `<section class="quiz-card" aria-labelledby="qq"><span class="eyebrow">Culture générale</span><h3 id="qq">${t.q}</h3>
      ${t.img ? (q.img ? `<figure class="qimg"><img src="${q.img.src}" alt="${esc(t.img.clue)}"><figcaption>${rev ? imgCredit(q.img) : "Image : Wikimedia Commons · crédit complet après la réponse"}</figcaption></figure>`
        : q.img === null ? `<p class="clue"><strong>Indice :</strong> ${t.img.clue}</p>` : `<div class="qimg wait">Chargement de l'image…</div>`) : ""}
      <div class="qbar">${timer}</div></section>`
    : `<section class="stage" aria-label="Platine"><div class="deck"><div class="disc ${live || rev ? "spinning" : ""}">${vinyl(l.color)}</div><div class="arm ${live || rev ? "down" : ""}">${ARM}</div></div>
      <div class="controls">${timer}${q.blocked ? `<button class="btn primary" id="mp-unblock">Toucher pour activer le son</button>` : ""}</div></section>`}
    ${status ? `<p class="hint" role="status">${status}</p>` : ""}
    ${typeMode ? `<form class="type-ans ${rev ? (res.ok ? "is-ok" : "is-ko") : canAnswer ? "" : "locked"}" id="type-form" novalidate>
      <label for="type-in">${quiz ? "Ta réponse" : "Quel artiste ? Le nom de famille suffit"}</label>
      <div class="type-row"><input id="type-in" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go"
        placeholder="${quiz ? "Pour une personne, le nom de famille suffit" : "Nom de l'artiste ou du groupe"}" value="${esc(q.typed)}" ${canAnswer ? "" : "disabled"} aria-describedby="type-msg">
        ${rev ? "" : `<button class="btn primary" type="submit" ${canAnswer ? "" : "disabled"}>Valider</button>`}</div>
      <p class="type-msg ${q.msg ? "ko" : ""}" id="type-msg">${rev || !canAnswer ? "" : q.msg || "Entrée pour valider. Le premier qui trouve gagne le point."}</p>
    </form>`
    : `<ol class="choices ${q.phase === "wait" ? "locked" : ""}" aria-label="${quiz ? "Quelle est la bonne réponse ?" : "Quel est ce morceau ?"}">
      ${q.choices.map((c, i) => {
        const cls = rev && c.ok ? "is-ok" : q.picked === i && !c.ok ? "is-ko" : "";
        return `<li><button class="choice ${cls}" data-i="${i}" ${canAnswer ? "" : "disabled"}><span class="k">${i + 1}</span><span class="t"><span class="title">${c.title}</span>${c.artist ? `<span class="artist">${c.artist}</span>` : ""}</span></button></li>`;
      }).join("")}</ol>`}
    ${rev ? `<section class="feedback ${res.ok ? "ok" : rev.winner ? "" : "ko"}">
      <h3 tabindex="-1" id="fb-h">${rev.winner ? (res.ok ? (rev.partial ? "Bon titre, tu marques un demi-point !" : "Tu as trouvé le premier !") : `${esc(rev.wname)} a trouvé${rev.partial ? " le titre" : ""} !`) : "Personne n'a trouvé"}</h3>
      ${rev.winner ? `<p class="mp-winner"><span class="av">${avSvg(rev.wav)}</span><span>${esc(rev.wname)} · +${fmtPts(rev.partial ? 0.5 : 1)} point${rev.typed ? ` · « ${esc(rev.typed)} »` : ""}</span></p>` : ""}
      ${quiz ? `<p class="answer">${t.answer}</p>` : `<div class="reveal">
        ${q.clip && q.clip.cover ? `<img src="${q.clip.cover}" alt="Pochette de l'album ${q.clip.album || ""}" width="72" height="72">` : ""}
        <div class="reveal-t"><p class="answer">${t.title} <span>· ${t.artist}${t.year ? ` · ${th.yearLabel} ${t.year}` : ""}</span></p></div></div>`}
      ${t.rank ? `<p class="rank"><span class="mono">N°${t.rank}</span> des ventes depuis 1969 · ${l.groupTitle}</p>` : ""}
      <p class="fact">${t.fact}</p>
      ${t.film || t.context ? `<dl class="notes">${t.film ? `<div><dt>À l'écran</dt><dd>${t.film}</dd></div>` : ""}${t.context ? `<div><dt>Contexte</dt><dd>${t.context}</dd></div>` : ""}</dl>` : ""}
      ${isHost ? `<button class="next" id="next">${q.qi + 1 < M.order.length ? (M.order[q.qi + 1].kind === "quiz" ? "Question suivante →" : "Morceau suivant →") : "Voir le classement →"}</button>`
        : `<p class="mode-line" role="status">L'hôte passe à la suite…</p>`}
    </section>` : ""}`;
  document.getElementById("mp-quit").addEventListener("click", () => mpLeave());
  document.getElementById("mp-mute").addEventListener("click", () => { M.muted = !M.muted; mpApplyMute(); const b = document.getElementById("mp-mute"); b.setAttribute("aria-pressed", M.muted); b.setAttribute("aria-label", M.muted ? "Remettre le son" : "Couper le son"); b.innerHTML = `${SOUND_ICO(!M.muted)}<span>${M.muted ? "Son coupé" : "Son"}</span>`; });
  const ub = document.getElementById("mp-unblock"); if (ub) ub.addEventListener("click", () => { unlockAudio(); q.blocked = false; if (q.clip) { const p = playClip(q.clip.url); if (p) p.catch(() => {}); mpApplyMute(); } mpRender(); });
  $app.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => mpAnswerChoice(+b.dataset.i)));
  const tf = document.getElementById("type-form");
  if (tf) {
    const inp = tf.querySelector("#type-in");
    inp.addEventListener("input", () => { q.typed = inp.value; });
    tf.addEventListener("submit", e => { e.preventDefault(); mpAnswerTyped(inp.value); });
    if ((typeFocused || (live && q.qi >= 0)) && !inp.disabled) { inp.focus({ preventScroll: true }); const n = inp.value.length; try { inp.setSelectionRange(n, n); } catch (e) {} }
  }
  const nx = document.getElementById("next"); if (nx) nx.addEventListener("click", () => { unlockAudio(); mpHostNext(); });
  if (live) mpTick();
}
document.addEventListener("keydown", e => {
  if (S.screen !== "mpgame" || !M || !M.q || M.mode === "saisie" || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) { e.preventDefault(); mpAnswerChoice(n - 1); }
});
window.addEventListener("pagehide", () => { if (M && M.net) try { M.net.leave(); } catch (e) {} });

function groupsOf(th) {
  if (th.levels.some(l => l.tier)) { // Rétro : une section par décennie, niveaux 1 à 3
    const keys = [...new Set(th.levels.map(l => l.decadeKey))];
    return keys.map(k => {
      const levels = th.levels.filter(l => l.decadeKey === k).sort((a, b) => a.tier - b.tier);
      return { title: levels[0].groupTitle, sub: levels[0].decade, blurb: levels[0].groupBlurb, source: levels[0].source, art: levels[0].instrument, color: levels[0].color, tiered: true, levels };
    });
  }
  const byLevel = th.levels.filter(l => l.group !== "style"), byStyle = th.levels.filter(l => l.group === "style");
  if (!byStyle.length) return [{ title: "Le programme", levels: th.levels }];
  return [{ title: "Par niveau", levels: byLevel }, { title: "Par style", levels: byStyle }];
}
const playOrder = th => groupsOf(th).flatMap(g => g.levels);
const TIER_NAMES = ["", "Facile", "Moyen", "Difficile"];
function renderTheme(th) {
  S.screen = "theme"; S.theme = th;
  $app.style.setProperty("--lvl", th.color);
