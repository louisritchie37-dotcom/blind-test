function startLevel(id) {
  S.level = S.theme.levels.find(l => l.id === id);
  S.order = (S.pre && S.pre[id]) || drawOrder(S.theme, S.level);
  if (S.pre) S.pre[id] = null;
  markSeen(S.theme, S.level, S.order);
  S.qi = 0; S.score = 0; S.results = []; S.mode = MODE;
  S.players = DUO ? DUO.names.map(name => ({ name, score: 0, correct: 0 })) : null;
  window.scrollTo({ top: 0 });
  newQuestion();
}

/* Cycle d'une question : loading → playing ⇄ paused → answered.
   L'élément suivant est préchargé pendant la manche en cours : au clic sur « Suivant », l'extrait
   démarre dans le même geste, sans second clic (indispensable sur téléphone). */
function newQuestion() {
  const t = S.order[S.qi], quiz = t.kind === "quiz";
  S.choices = quiz
    ? shuffle([{ title: t.answer, ok: true }, ...t.decoys.map(d => ({ title: d, ok: false }))])
    : shuffle([{ title: t.title, artist: t.artist, ok: true }, ...t.decoys.map(([title, artist]) => ({ title, artist, ok: false }))]);
  S.phase = "loading"; S.picked = null; S.typed = ""; S.tries = 0; S.typeMsg = ""; V.msg = ""; S.clip = undefined; S.img = undefined; S.elapsed = 0; S.simulated = false; S.silent = quiz;
  S.simMsg = quiz ? "" : "Recherche de l'extrait sur Deezer…";
  const token = ++S.token;
  renderGame();
  prefetch(S.order[S.qi + 1], true);
  if (quiz) {
    if (!t.img) { beginTimer("", true); return; }
    const done = info => { if (token !== S.token || S.phase !== "loading") return; S.img = info; beginTimer("", true); };
    if (IMG_CACHE.has(t.img.wiki)) { done(IMG_CACHE.get(t.img.wiki)); return; }
    getImage(t.img.wiki).then(done);
    setTimeout(() => done(null), 7000);
    return;
  }
  const key = t.artist + "|" + t.title;
  if (PREVIEW_CACHE.has(key)) { S.clip = PREVIEW_CACHE.get(key); autoStart(token); return; }
  getPreview(t).then(c => { if (token === S.token) { S.clip = c; autoStart(token); } });
}
/* Ordres de jeu tirés à l'avance, pour précharger le premier élément de chaque set. */
/* Une partie = 10 morceaux tirés parmi les 30 de la carte. On fait tourner : les morceaux déjà joués
   ne reviennent qu'une fois que toute la carte est passée. Le Mix garde ses 10 manches. */
const SET_SIZE = 10, SEEN_KEY = "blindtest-seen";
const tkey = t => t.kind === "quiz" ? "q|" + t.q : t.title + "|" + t.artist;
function loadSeen() { try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || {}; } catch (e) { return {}; } }
function drawOrder(th, l) {
  if (l.tracks.length <= SET_SIZE) return shuffle(l.tracks);
  const seen = new Set(loadSeen()[th.id + "-" + l.id] || []);
  let pick = shuffle(l.tracks.filter(t => !seen.has(tkey(t)))).slice(0, SET_SIZE);
  if (pick.length < SET_SIZE) pick = pick.concat(shuffle(l.tracks.filter(t => !pick.includes(t))).slice(0, SET_SIZE - pick.length));
  return shuffle(pick);
}
function markSeen(th, l, order) {
  if (l.tracks.length <= SET_SIZE) return;
  const all = loadSeen(), k = th.id + "-" + l.id;
  let seen = new Set([...(all[k] || []), ...order.map(tkey)]);
  if (seen.size >= l.tracks.length) seen = new Set(order.map(tkey)); // carte entièrement jouée : nouveau tour
  all[k] = [...seen];
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(all)); } catch (e) {}
}
function prepareOrders(levels) {
  S.pre = S.pre || {};
  levels.forEach(l => { if (!l) return; const o = drawOrder(S.theme, l); S.pre[l.id] = o; prefetch(o[0]); });
}

async function autoStart(token) {
  if (S.phase !== "loading") return;
  if (document.hidden) { S.phase = "idle"; S.simMsg = "Extrait prêt : appuie sur Lancer."; renderGame(); return; }
  if (!S.clip) { startCrackle(); beginTimer("Extrait introuvable sur Deezer · simulé", true); return; }
  try {
    await playClip(S.clip.url);
    if (token !== S.token || S.phase !== "loading") { stopClip(); return; }
    beginTimer("Extrait Deezer · 30 secondes", false);
  } catch (e) {
    if (token !== S.token) return;
    S.phase = "idle"; S.simMsg = "Le navigateur a bloqué la lecture automatique : appuie sur Lancer.";
    renderGame(); focusPlay();
  }
}

function beginTimer(msg, simulated) {
  S.phase = "playing"; S.simMsg = msg; S.simulated = simulated; S.t0 = performance.now();
  renderGame(); focusPlay();
  const who = S.players ? `Au tour de ${S.players[turnOf(S.qi)].name}. ` : "";
  say(who + (S.silent ? "Question affichée. Quatre réponses disponibles." : "Extrait lancé. Quatre réponses disponibles."));
  tick();
}

function onPlayButton() {
  if (S.phase === "idle") {
    if (S.clip) playClip(S.clip.url).then(() => beginTimer("Extrait Deezer · 30 secondes", false)).catch(() => { startCrackle(); beginTimer("Lecture impossible · extrait simulé", true); });
    else { startCrackle(); beginTimer("Extrait introuvable sur Deezer · simulé", true); }
  } else if (S.phase === "playing") pauseRound();
  else if (S.phase === "paused") resumeRound();
  else if (S.phase === "answered" && canReplay()) {
    if (!player.paused) player.pause();
    else { if (player.ended) player.currentTime = 0; const p = player.play(); if (p) p.catch(() => {}); }
  }
}
/* Après la réponse, l'extrait continue jusqu'au morceau suivant ; le bouton reste Pause / Reprendre / Réécouter. */
const canReplay = () => S.phase === "answered" && S.order[S.qi].kind !== "quiz" && !!S.clip && !S.simulated;
function deckLabel() { return !player.paused ? ["Pause", PAUSE_ICO] : player.ended ? ["Réécouter", PLAY_ICO] : ["Reprendre", PLAY_ICO]; }
function syncDeck() {
  if (S.screen !== "game" || !canReplay()) return;
  const b = document.getElementById("play"), on = !player.paused, [lbl, ico] = deckLabel();
  if (b) { b.classList.toggle("is-pause", on); b.setAttribute("aria-label", lbl); b.innerHTML = `<span class="ico">${ico}</span>${lbl}`; }
  const d = document.querySelector(".deck .disc"), a = document.querySelector(".deck .arm");
  if (d) d.classList.toggle("spinning", on);
  if (a) a.classList.toggle("down", on);
}
players.forEach(a => ["play", "pause", "ended"].forEach(ev => a.addEventListener(ev, e => { if (e.target === player) syncDeck(); })));

/* ===================== Mises à jour =====================
   L'app installée peut garder une ancienne version en mémoire. Au retour sur l'app (et toutes les 10 minutes),
   on regarde si le site a changé ; si oui, un bandeau propose de recharger. */
const APP_VERSION = "27/11/2026 à 16h06";
async function checkUpdate() {
  if (!/^https?:$/.test(location.protocol) || document.getElementById("update-bar")) return;
  try {
    const html = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" }).then(r => r.text());
    const m = html.match(/const APP_VERSION = "([^"]+)"/);
    if (!m || m[1] === APP_VERSION || m[1] === "__BUILD__") return;
    const bar = document.createElement("div");
    bar.id = "update-bar"; bar.className = "update-bar"; bar.setAttribute("role", "status");
    bar.innerHTML = `<span>Nouvelle version disponible</span><button type="button">Mettre à jour</button>`;
    bar.querySelector("button").addEventListener("click", () => location.reload());
    document.body.appendChild(bar);
  } catch (e) {}
}
setTimeout(checkUpdate, 3000);
setInterval(checkUpdate, 10 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });

/* ===================== Commande vocale =====================
   Bouton micro : maintenu = on parle tant qu'on appuie ; tapé = l'écoute s'arrête toute seule à la fin de la phrase.
   Pendant l'écoute, la musique est coupée (mise en pause sur iPhone, où le volume n'est pas réglable). */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const VOL_OK = (() => { try { const a = new Audio(); a.volume = 0.5; return a.volume === 0.5; } catch (e) { return false; } })();
const V = { rec: null, on: false, msg: "", heard: "", downAt: 0, held: false, resume: false, duckT: 0, ducked: false };
const MIC_ICO = `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="1" width="6" height="9" rx="3" fill="#e0b04f"/><path d="M3 7.5a5 5 0 0 0 10 0h-1.6a3.4 3.4 0 0 1-6.8 0zM7.2 12.4h1.6V15H7.2z" fill="#e0b04f"/></svg>`;
const voiceUsable = () => !!SR && ["playing", "paused", "answered"].includes(S.phase);
function voiceBar() {
  if (!SR) return "";
  const lbl = V.on ? "J'écoute… relâche pour valider" : "Maintenir pour parler";
  return `<div class="voice">
      <button type="button" class="mic ${V.on ? "on" : ""}" id="mic" aria-pressed="${V.on}" ${voiceUsable() ? "" : "disabled"}><span class="dot">${MIC_ICO}</span><span class="mic-l">${lbl}</span></button>
      <p class="voice-msg" id="voice-msg" aria-live="polite">${V.msg || (S.phase === "answered" ? "Dis « suivant » pour continuer." : typing() ? (S.order[S.qi].kind === "quiz" ? "Dis ta réponse." : "Dis le nom de l'artiste.") : S.order[S.qi].kind === "quiz" ? "Dis le numéro ou la réponse." : "Dis le numéro, le titre ou l'artiste.")}</p>
    </div>`;
}
function voiceUI() {
  const b = document.getElementById("mic"), m = document.getElementById("voice-msg");
  if (b) { b.classList.toggle("on", V.on); b.setAttribute("aria-pressed", V.on); const l = b.querySelector(".mic-l"); if (l) l.textContent = V.on ? "J'écoute… relâche pour valider" : "Maintenir pour parler"; }
  if (m) m.innerHTML = V.msg;
}
function duck(on) {
  if (V.ducked === on) return;
  V.ducked = on;
  clearInterval(V.duckT);
  try { if (crackleSrc && crackleGain && actx) crackleGain.gain.setTargetAtTime(on ? 0.05 : 0.45, actx.currentTime, 0.06); } catch (e) {}
  if (!VOL_OK) { // iPhone : pas de volume, on met en pause le temps de parler
    if (on && !player.paused) { V.resume = true; player.pause(); }
    else if (!on && V.resume) { V.resume = false; if (S.phase === "playing" || S.phase === "answered") { const p = player.play(); if (p) p.catch(() => {}); } }
    return;
  }
  const el = player, target = on ? 0 : 1;
  V.duckT = setInterval(() => {
    const v = el.volume + (target - el.volume) * 0.35;
    el.volume = Math.abs(target - v) < 0.02 ? target : v;
    if (el.volume === target) clearInterval(V.duckT);
  }, 15);
}
function micStart() {
  if (!SR || V.on || !voiceUsable()) return;
  const r = new SR();
  r.lang = "fr-FR"; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
  let finals = null;
  r.onresult = e => {
    const res = e.results[e.results.length - 1];
    if (res.isFinal) finals = Array.from(res, a => a.transcript.trim()).filter(Boolean);
    else { V.msg = `<q>${esc(res[0].transcript)}</q>`; voiceUI(); }
  };
  r.onerror = e => {
    V.msg = e.error === "not-allowed" || e.error === "service-not-allowed" ? "Micro refusé : autorise-le dans les réglages du navigateur."
      : e.error === "no-speech" ? "Je n'ai rien entendu. Réessaie."
      : e.error === "network" ? "Reconnaissance vocale indisponible sans réseau."
      : e.error === "aborted" ? V.msg : "Le micro n'a pas marché. Réessaie.";
  };
  /* Deux niveaux seulement : la musique s'éteint dès l'appui et revient quand l'écoute est finie.
     À zéro, la baisse automatique de Windows ou d'Android pendant l'usage du micro ne s'entend plus. */
  r.onend = () => {
    V.on = false; V.rec = null; duck(false);
    if (finals && finals.length) handleVoice(finals); else voiceUI();
  };
  try { r.start(); } catch (e) { return; }
  V.rec = r; V.on = true; V.msg = "J'écoute…"; voiceUI(); duck(true);
}
function micStop() { if (V.rec) try { V.rec.stop(); } catch (e) {} }

const NUM_WORDS = [["1", "un", "une", "premier", "premiere", "hein"], ["2", "deux", "deuxieme", "second", "seconde", "de"], ["3", "trois", "troisieme"], ["4", "quatre", "quatrieme", "cat", "catre"]];
const CMD = {
  next: ["suivant", "suivante", "la suivante", "chanson suivante", "morceau suivant", "question suivante", "next", "on continue", "continue", "resultat", "voir le resultat"],
  pass: ["je passe", "passe", "joker", "je sais pas", "je ne sais pas", "aucune idee"],
  pause: ["pause", "stop", "arrete"],
  play: ["reprendre", "reprends", "lecture", "play", "rejoue", "reecouter", "encore"]
};
function voiceNumber(alts) {
  for (const a of alts) {
    const t = toks(a).filter(x => !["le", "la", "reponse", "numero", "c", "est", "cest", "n"].includes(x));
    if (t.length === 1) { const i = NUM_WORDS.findIndex(w => w.includes(t[0])); if (i >= 0) return i; }
  }
  return -1;
}
function handleVoice(alts) {
  const said = alts[0];
  V.heard = said;
  const phrases = alts.map(a => toks(a).join(" "));
  const is = k => phrases.some(p => CMD[k].includes(p));
  const live = S.phase === "playing" || S.phase === "paused";
  V.msg = `Entendu : <q>${esc(said)}</q>`;
  if (S.phase === "answered") {
    if (is("next")) { const n = document.getElementById("next"); V.msg = ""; if (n) n.click(); return; }
    if (is("pause") && !player.paused) { player.pause(); voiceUI(); return; }
    if (is("play") && canReplay()) { onPlayButton(); voiceUI(); return; }
    V.msg += " · dis « suivant » pour continuer."; voiceUI(); return;
  }
  if (!live) { voiceUI(); return; }
  if (is("pass")) { V.msg = ""; answer(null, { pass: true }); return; }
  if (is("pause") && S.phase === "playing") { pauseRound(); voiceUI(); return; }
  if (is("play") && S.phase === "paused") { resumeRound(); voiceUI(); return; }
  const t = S.order[S.qi];
  if (typing()) {
    const hit = alts.find(a => typedMatch(a, t)) || (t.kind !== "quiz" && alts.find(a => titleMatch(a, t.title)));
    const inp = document.getElementById("type-in"); if (inp) inp.value = hit || said;
    V.msg = "";
    submitTyped(hit || said);
    if (!hit) { V.msg = `Entendu : <q>${esc(said)}</q>`; voiceUI(); }
    return;
  }
  let i = voiceNumber(alts);
  if (i < 0) {
    for (const a of alts) {
      const m = S.choices.map((c, k) => (titleMatch(a, c.title) || (c.artist && artistMatch(a, c.artist))) ? k : -1).filter(k => k >= 0);
      if (m.length === 1) { i = m[0]; break; }
    }
  }
  if (i >= 0 && i < S.choices.length) { V.msg = ""; answer(i); return; }
  V.msg += " · pas reconnu, réessaie ou touche une réponse."; voiceUI();
}
function bindMic() {
  const b = document.getElementById("mic");
  if (!b) return;
  b.addEventListener("contextmenu", e => e.preventDefault());
  b.addEventListener("pointerdown", e => {
    if (b.disabled || e.button > 0) return;
    e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (er) {}
    if (V.on) { micStop(); V.downAt = 0; return; }
    V.downAt = performance.now(); micStart();
  });
  const up = () => { if (V.downAt && performance.now() - V.downAt > 450) micStop(); V.downAt = 0; };
  b.addEventListener("pointerup", up);
  b.addEventListener("pointercancel", up);
  b.addEventListener("click", e => { if (e.detail === 0) { V.on ? micStop() : micStart(); } }); // clavier : Entrée / Espace
}
function pauseRound() {
  cancelAnimationFrame(S.raf);
  S.elapsed += (performance.now() - S.t0) / 1000;
  if (S.silent) {} else if (S.simulated) stopCrackle(); else player.pause();
  S.phase = "paused"; renderGame(); focusPlay(); say("Pause.");
}
function resumeRound() {
  if (S.silent) {} else if (S.simulated) startCrackle(); else { const p = player.play(); if (p) p.catch(() => {}); }
  S.phase = "playing"; S.t0 = performance.now();
  renderGame(); focusPlay(); tick();
}
const typing = () => S.mode === "saisie" && !!S.order[S.qi];
const roundSecs = () => typing() ? TYPE_SECONDS : ROUND_SECONDS;
const leftNow = () => Math.max(0, roundSecs() - S.elapsed - (S.phase === "playing" ? (performance.now() - S.t0) / 1000 : 0));
function tick() {
  const left = leftNow();
  const clock = document.getElementById("clock"), bar = document.getElementById("bar");
  if (clock) clock.textContent = "00:" + pad2(Math.ceil(left));
  if (bar) bar.style.transform = `scaleX(${left / roundSecs()})`;
  if (left <= 0) { answer(null); return; }
  S.raf = requestAnimationFrame(tick);
}
function stopRound() { cancelAnimationFrame(S.raf); stopCrackle(); stopClip(); micStop(); }
function focusPlay() {
  const inp = document.getElementById("type-in");
  if (inp && S.phase === "playing") { inp.focus({ preventScroll: true }); return; }
  const p = document.getElementById("play"); if (p && !p.disabled) p.focus();
}

const imgCredit = im => `Image : ${esc(im.author)} · ${esc(im.license)} · <a href="${im.page}" target="_blank" rel="noopener">Wikimedia Commons</a>${im.article ? ` · <a href="${im.article}" target="_blank" rel="noopener">article Wikipédia</a>` : ""}`;
const itemLine = t => t.kind === "quiz" ? `${t.q} <span>· ${t.answer}</span>` : `${t.title} <span>· ${t.artist}${t.year ? ` (${t.year})` : ""}</span>`;

function renderGame() {
  S.screen = "game";
  const th = S.theme, l = S.level, t = S.order[S.qi], n = S.order.length, quiz = t.kind === "quiz";
  const ph = S.phase, answered = ph === "answered", live = ph === "playing" || ph === "paused";
  const res = S.results[S.qi];
  const left = answered ? 0 : leftNow();
  const replay = canReplay(), musicOn = replay && !player.paused;
  const btn = replay ? [...deckLabel(), false] : {
    loading: ["Chargement…", PLAY_ICO, true], idle: ["Lancer l'extrait", PLAY_ICO, false],
    playing: ["Pause", PAUSE_ICO, false], paused: ["Reprendre", PLAY_ICO, false], answered: [quiz ? "Question terminée" : "Extrait terminé", PLAY_ICO, true]
  }[ph];
  const turn = S.players ? turnOf(S.qi) : -1;
  const typeMode = typing();
  const typeFocused = document.activeElement && document.activeElement.id === "type-in";
  $app.style.setProperty("--lvl", l.color);
  $app.style.setProperty("--pc", S.players ? PCOLORS[turn] : l.color);
  const playBtn = `<button class="play ${ph === "playing" || musicOn ? "is-pause" : ""}" id="play" ${btn[2] ? "disabled" : ""} aria-label="${btn[0]}"><span class="ico">${btn[1]}</span>${btn[0]}</button>`;
  const timer = `<div class="timer">
          <div class="row"><span>${ph === "paused" ? "En pause" : "Temps restant"}</span><span class="clock mono" id="clock">00:${pad2(Math.ceil(left))}</span></div>
          <div class="bar"><i id="bar" style="transform:scaleX(${left / roundSecs()})"></i></div>
        </div>`;
  const nt = S.order[S.qi + 1];
  const nextLabel = !nt ? "Voir le résultat →"
    : S.players ? `Au tour de ${esc(S.players[turnOf(S.qi + 1)].name)} →`
    : nt.kind === "quiz" ? "Question suivante →" : "Morceau suivant →";
  $app.innerHTML = `
    <div class="topbar">
      <button class="back" id="back">← ${th.name}</button>
      ${S.players
        ? `<div class="duo-score" aria-label="Scores">${S.players.map((p, i) => `<span class="pl ${i === turn && !answered ? "on" : ""}" style="--pc:${PCOLORS[i]}"><span class="nm">${esc(p.name)}</span><span class="val mono">${p.score}</span></span>`).join("")}</div>`
        : `<div class="scorebox"><span class="eyebrow">Score</span><div class="val mono">${S.score}</div></div>`}
    </div>
    <div class="level-title">
      <span class="eyebrow">${l.tier ? `Niveau ${l.tier}` : `Set ${pad2(l.id)}`} · ${quiz ? "Question" : "Morceau"} ${S.qi + 1} sur ${n}</span>
      <h2>${l.name}</h2>
      <div class="dots" aria-hidden="true">${S.order.map((_, i) => `<span class="${i < S.results.length ? (S.results[i].ok ? "ok" : "ko") : i === S.qi ? "cur" : ""}"></span>`).join("")}</div>
    </div>
    ${S.players && !answered ? `<div class="turn" role="status"><span class="turn-dot" aria-hidden="true"></span><span class="turn-lbl">C'est au tour de</span><strong>${esc(S.players[turn].name)}</strong></div>` : ""}
    ${quiz ? `
    <section class="quiz-card ${S.players ? "duo" : ""}" aria-labelledby="qq">
      <span class="eyebrow">Culture générale</span>
      <h3 id="qq">${t.q}</h3>
      ${t.img ? (S.img
        ? `<figure class="qimg"><img src="${S.img.src}" alt="${esc(t.img.clue)}"><figcaption>${answered ? imgCredit(S.img) : "Image : Wikimedia Commons · crédit complet après la réponse"}</figcaption></figure>`
        : S.img === null ? `<p class="clue"><strong>Indice :</strong> ${t.img.clue}</p>`
        : `<div class="qimg wait">Chargement de l'image…</div>`) : ""}
      <div class="qbar">${playBtn}${timer}</div>
    </section>` : `
    <section class="stage ${S.players ? "duo" : ""}" aria-label="Platine">
      <div class="deck">
        <div class="disc ${ph === "playing" || musicOn ? "spinning" : ""}">${vinyl(l.color)}</div>
        <div class="arm ${live || musicOn ? "down" : ""}">${ARM}</div>
      </div>
      <div class="controls">
        ${playBtn}
        ${timer}
        <p class="sim" id="sim">${S.simMsg}</p>
      </div>
    </section>`}
    ${!quiz && !live && !answered ? `<p class="hint">${ph === "loading" ? "L'extrait démarre tout seul." : "Lance l'extrait pour débloquer les réponses."}${typeMode ? "" : " Raccourcis : 1 à 4 pour répondre, P pour la pause."}</p>` : ""}
    ${answered ? "" : voiceBar()}
    ${typeMode ? `
    <form class="type-ans ${answered ? (res.ok ? "is-ok" : "is-ko") : live ? "" : "locked"}" id="type-form" novalidate>
      <label for="type-in">${quiz ? "Ta réponse" : "Quel artiste ? Le nom de famille suffit"}</label>
      <div class="type-row">
        <input id="type-in" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go"
          placeholder="${quiz ? "Pour une personne, le nom de famille suffit" : "Nom de l'artiste ou du groupe"}" value="${esc(S.typed || "")}" ${answered ? "disabled" : ""} aria-describedby="type-msg">
        ${answered ? "" : `<button class="btn primary" type="submit" ${live ? "" : "disabled"}>Valider</button>`}
      </div>
      <div class="type-foot">
        <p class="type-msg ${S.typeMsg && !answered ? "ko" : ""}" id="type-msg">${answered ? "" : S.typeMsg || (S.tries ? "" : quiz ? "Entrée pour valider. Tu peux réessayer jusqu'à la fin du temps." : "Entrée pour valider. Le titre seul rapporte la moitié des points.")}</p>
        ${live ? `<button type="button" class="linkish" id="give-up">Je passe</button>` : ""}
      </div>
    </form>` : `
    <ol class="choices ${!live && !answered ? "locked" : ""}" aria-label="${quiz ? "Quelle est la bonne réponse ?" : "Quel est ce morceau ?"}">
      ${S.choices.map((c, i) => {
        let cls = "";
        if (answered && c.ok) cls = "is-ok";
        else if (answered && S.picked === i && !c.ok) cls = "is-ko";
        return `<li><button class="choice ${cls}" data-i="${i}" ${!live ? "disabled" : ""}>
          <span class="k">${i + 1}</span><span class="t"><span class="title">${c.title}</span>${c.artist ? `<span class="artist">${c.artist}</span>` : ""}</span>
        </button></li>`;
      }).join("")}
    </ol>`}
    ${answered ? `
      <section class="feedback ${res.ok ? "ok" : "ko"}">
        <h3 tabindex="-1" id="fb-h">${S.players ? (res.partial ? `Bon titre, ${esc(S.players[res.player].name)} !` : res.ok ? `Bien joué, ${esc(S.players[res.player].name)} !` : res.pass ? `${esc(S.players[res.player].name)} passe` : res.timeout ? `Temps écoulé pour ${esc(S.players[res.player].name)}` : `Raté, ${esc(S.players[res.player].name)}`) : res.partial ? "Bon titre !" : res.ok ? "Bien joué !" : res.pass ? "Passé" : res.timeout ? "Temps écoulé" : "Raté"}</h3>
        ${typeMode && res.typed ? `<p class="mode-line">Ta réponse : « ${esc(res.typed)} »</p>` : ""}
        ${quiz ? `<p class="answer">${t.answer}</p>` : `
        <div class="reveal">
          ${S.clip && S.clip.cover ? `<img src="${S.clip.cover}" alt="Pochette de l'album ${S.clip.album || ""}" width="72" height="72">` : ""}
          <div class="reveal-t">
            <p class="answer">${t.title} <span>· ${t.artist}${t.year ? ` · ${th.yearLabel} ${t.year}` : ""}</span></p>
            ${S.clip && S.clip.link ? `<a class="dz" href="${S.clip.link}" target="_blank" rel="noopener">Écouter en entier sur Deezer ↗</a>` : ""}
          </div>
        </div>`}
        ${t.rank ? `<p class="rank"><span class="mono">N°${t.rank}</span> des ventes depuis 1969 · ${l.groupTitle}</p>` : ""}
        <p class="fact">${t.fact}</p>
        ${t.film || t.context ? `<dl class="notes">
          ${t.film ? `<div><dt>À l'écran</dt><dd>${t.film}</dd></div>` : ""}
          ${t.context ? `<div><dt>Contexte</dt><dd>${t.context}</dd></div>` : ""}
        </dl>` : ""}
        <p class="pts mono">${res.partial ? `+${res.points} pts (titre seul : moitié des points, il manquait l'artiste)` : res.ok ? `+${res.points} pts (dont ${res.points - BASE_POINTS} de bonus vitesse)` : "+0 pt"}</p>
        <button class="next" id="next">${nextLabel}</button>
      </section>` : ""}`;

  $app.querySelector("#back").addEventListener("click", () => { stopRound(); S.token++; S.phase = "idle"; renderTheme(th); });
  const play = $app.querySelector("#play"); if (play) play.addEventListener("click", onPlayButton);
  $app.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => answer(+b.dataset.i)));
  bindMic();
  const tf = $app.querySelector("#type-form");
  if (tf) {
    const inp = tf.querySelector("#type-in");
    inp.addEventListener("input", () => { S.typed = inp.value; });
    tf.addEventListener("submit", e => { e.preventDefault(); submitTyped(inp.value); });
    const gu = tf.querySelector("#give-up"); if (gu) gu.addEventListener("click", () => answer(null, { pass: true }));
    if (typeFocused && !inp.disabled) { inp.focus({ preventScroll: true }); const n = inp.value.length; try { inp.setSelectionRange(n, n); } catch (e) {} }
  }
  const next = $app.querySelector("#next");
  if (next) next.addEventListener("click", () => { clearInterval(fadeT); if (!player.paused) player.pause(); unlockAudio(); goNext(); });
}

function submitTyped(v) {
  if (S.phase !== "playing" && S.phase !== "paused") return;
  S.typed = v;
  if (!v.trim()) { document.getElementById("type-in").focus(); return; }
  const t = S.order[S.qi];
  if (typedMatch(v, t)) { answer(null, { typed: v, ok: true }); return; }
  if (t.kind !== "quiz" && titleMatch(v, t.title)) { answer(null, { typed: v, ok: true, partial: true }); return; } // le titre seul : moitié des points
  S.tries++;
  S.typeMsg = "Pas ça. Essaie encore.";
  const msg = document.getElementById("type-msg"), row = document.querySelector(".type-row"), inp = document.getElementById("type-in");
  if (msg) { msg.textContent = S.typeMsg; msg.classList.add("ko"); }
  if (row) { row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake"); }
  if (inp) { inp.focus(); inp.select(); }
  say(S.typeMsg);
}
function answer(i, o = {}) {
  if (S.phase !== "playing" && S.phase !== "paused") return;
  const left = leftNow();
  cancelAnimationFrame(S.raf); stopCrackle();
  if (i === null && !o.typed && typing() && S.typed && S.typed.trim()) o.typed = S.typed.trim();
  const ok = "ok" in o ? o.ok : i !== null && S.choices[i].ok;
  const full = ok ? BASE_POINTS + Math.round(left) * BONUS_PER_SEC : 0;
  const points = o.partial ? Math.round(full / 2) : full;
  S.score += points; S.picked = i; S.phase = "answered";
  const player = turnOf(S.qi);
  if (S.players) { S.players[player].score += points; if (ok) S.players[player].correct++; }
  S.results.push({ ok, points, timeout: i === null && !o.pass && !("ok" in o), pass: !!o.pass, partial: !!o.partial, typed: o.typed || "", player });
  renderGame();
  const t = S.order[S.qi];
  say(`${ok ? "Bonne réponse" : "Mauvaise réponse"}. C'était ${t.title}, de ${t.artist}.`);
  const fb = document.querySelector(".feedback"), nx = document.getElementById("next");
  const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (nx) nx.focus({ preventScroll: true });
  if (fb) requestAnimationFrame(() => fb.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "end" }));
}
function goNext() {
  if (S.qi + 1 < S.order.length) { S.qi++; newQuestion(); }
  else renderResult();
}

function renderResult() {
  if (S.players) return renderDuoResult();
  S.screen = "result";
  const th = S.theme, l = S.level, total = S.order.length, correct = S.results.filter(r => r.ok).length, stars = starsFor(correct, total);
  const k = bkey(th, l), prev = best[k];
  const isRecord = !prev || S.score > prev.points;
  if (isRecord) { best[k] = { points: S.score, correct, total }; saveBest(best); }
  const vi = correct === total ? 5 : Math.min(4, Math.floor(correct / total * 5));
  const verdict = ["Le DJ a fait une pause.", "Encore quelques disques (et quelques livres) à découvrir.", "Pas mal du tout.", "Belle oreille.", "Presque parfait.", "Un sans-faute. Le club t'offre un verre."][vi];
  const order = playOrder(th), nextLevel = order[order.indexOf(l) + 1];
  prepareOrders([l, nextLevel]);
  if (S.pre[l.id]) prefetch(S.pre[l.id][0], true);
  $app.innerHTML = `
    <div class="topbar"><button class="back" id="back">← ${th.name}</button><span class="eyebrow">Fin du ${l.tier ? `niveau ${l.tier}` : `set ${pad2(l.id)}`}</span></div>
    <section class="result-card" style="--lvl:${l.color}">
      <div class="stack" style="gap:8px">
        <span class="eyebrow">${th.name} · ${l.name}</span>
        <div class="big mono" style="font-family:var(--f-display)">${S.score}<span style="font-size:.4em;color:var(--smoke)"> pts</span></div>
        <div>${starStr(stars)}</div>
        <p class="verdict" tabindex="-1" id="verdict">${correct} sur ${total} trouvés. ${verdict}</p>
        ${isRecord ? `<span class="chip" style="align-self:flex-start">Nouveau record</span>` : `<span class="best">Record : ${prev.points} pts</span>`}
      </div>
      <div class="art">${ART[l.instrument](l.color)}</div>
    </section>
    <section class="stack" style="gap:10px">
      <h2 style="font-size:24px">La setlist</h2>
      <ol class="recap">
        ${S.order.map((t, i) => { const r = S.results[i]; return `<li>
          <span class="mark ${r.ok ? "ok" : "ko"}" aria-label="${r.ok ? "Trouvé" : "Raté"}">${r.ok ? "✓" : "✕"}</span>
          <span class="t">${itemLine(t)}</span>
          <span class="p mono">${r.points}</span></li>`; }).join("")}
      </ol>
    </section>
    <div class="actions">
      <button class="btn primary" id="again">Rejouer ce set</button>
      ${nextLevel ? `<button class="btn" id="nextlvl">Set suivant : ${nextLevel.name}</button>` : ""}
    </div>`;
  $app.querySelector("#back").addEventListener("click", () => renderTheme(th));
  $app.querySelector("#again").addEventListener("click", () => { unlockAudio(); startLevel(l.id); });
  const nl = $app.querySelector("#nextlvl"); nl && nl.addEventListener("click", () => { unlockAudio(); startLevel(nextLevel.id); });
  window.scrollTo({ top: 0 });
  document.getElementById("verdict").focus();
}

function renderDuoResult() {
  S.screen = "result";
  const th = S.theme, l = S.level, P = S.players;
  const per = P.map((_, i) => S.results.filter(r => r.player === i).length);
  const ranked = P.map((p, i) => ({ ...p, i })).sort((a, b) => b.score - a.score);
  const tie = ranked[0].score === ranked[1].score;
  const head = tie ? "Égalité !" : `${esc(ranked[0].name)} gagne !`;
  const sub = tie ? `${ranked[0].score} points chacun. Il va falloir une revanche.` : `${ranked[0].score} points contre ${ranked[1].score}.`;
  const order = playOrder(th), nextLevel = order[order.indexOf(l) + 1];
  prepareOrders([l, nextLevel]);
  if (S.pre[l.id]) prefetch(S.pre[l.id][0], true);
  $app.innerHTML = `
    <div class="topbar"><button class="back" id="back">← ${th.name}</button><span class="eyebrow">Duo · fin du ${l.tier ? `niveau ${l.tier}` : `set ${pad2(l.id)}`}</span></div>
    <section class="result-card" style="--lvl:${l.color}">
      <div class="stack" style="gap:8px">
        <span class="eyebrow">${th.name} · ${l.name}</span>
        <div class="big" style="font-family:var(--f-display)" tabindex="-1" id="verdict">${head}</div>
        <p class="verdict">${sub}</p>
        <ol class="podium">${ranked.map((p, k) => `<li class="${!tie && k === 0 ? "win" : ""}">
          <span class="nm">${esc(p.name)}</span><span class="mono">${p.correct} / ${per[p.i]} trouvés</span><span class="mono pts">${p.score} pts</span></li>`).join("")}</ol>
      </div>
      <div class="art">${ART[l.instrument](l.color)}</div>
    </section>
    <section class="stack" style="gap:10px">
      <h2 style="font-size:24px">La setlist</h2>
      <ol class="recap duo">
        ${S.order.map((t, i) => { const r = S.results[i]; return `<li>
          <span class="mark ${r.ok ? "ok" : "ko"}" aria-label="${r.ok ? "Trouvé" : "Raté"}">${r.ok ? "✓" : "✕"}</span>
          <span class="t">${itemLine(t)}<span class="who" style="color:${PCOLORS[r.player]}">${esc(P[r.player].name)}</span></span>
          <span class="p mono">${r.points}</span></li>`; }).join("")}
      </ol>
    </section>
    <div class="actions">
      <button class="btn primary" id="again">Revanche sur ce set</button>
      ${nextLevel ? `<button class="btn" id="nextlvl">Set suivant : ${nextLevel.name}</button>` : ""}
    </div>
    <p class="best">En Duo, les scores ne comptent pas dans tes records solo.</p>`;
  $app.querySelector("#back").addEventListener("click", () => renderTheme(th));
  $app.querySelector("#again").addEventListener("click", () => { unlockAudio(); startLevel(l.id); });
  const nl = $app.querySelector("#nextlvl"); nl && nl.addEventListener("click", () => { unlockAudio(); startLevel(nextLevel.id); });
  window.scrollTo({ top: 0 });
  document.getElementById("verdict").focus();
}

/* Téléphone verrouillé, onglet changé ou page fermée : on coupe le son et on met le chrono en pause. */
function pauseForBackground() {
  micStop();
  if (S.phase === "playing") pauseRound();
  else { stopCrackle(); if (!player.paused) player.pause(); }
}
document.addEventListener("visibilitychange", () => { if (document.hidden) pauseForBackground(); });
window.addEventListener("pagehide", pauseForBackground);
window.addEventListener("blur", () => { if (document.hidden) pauseForBackground(); });

document.addEventListener("keydown", e => {
  if (S.screen !== "game" || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if ((e.key === "p" || e.key === "P") && (S.phase === "playing" || S.phase === "paused" || canReplay())) { e.preventDefault(); onPlayButton(); return; }
  if (S.phase !== "playing" && S.phase !== "paused") return;
  const n = parseInt(e.key, 10);
  if (typing()) return;
  if (n >= 1 && n <= 4) { e.preventDefault(); answer(n - 1); }
});

{ const j = new URLSearchParams(location.search).get("join");
  if (j && /^[A-Z0-9]{4,8}$/i.test(j)) renderMpJoin(j.toUpperCase()); else renderHome(); }
</script>
