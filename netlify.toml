[build]
  publish = "."

# Proxy vers l'API Deezer : évite le blocage CORS du navigateur.
[[redirects]]
  from = "/api/deezer/*"
  to = "https://api.deezer.com/:splat"
  status = 200
  force = true

# Manifeste de l'app (icône et nom sur l'écran d'accueil)
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
